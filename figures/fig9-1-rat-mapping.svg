<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <title>图9-1 RAT 映射随指令变化</title>
  <desc>两条都写 R1 的 uop 分别拿到 P10 和 P11。RAT 表按程序顺序更新，后写的覆盖前一条的登记；读 R1 的 uop 按当下时刻的登记拿到物理号。图下方用四步展示映射变化。</desc>
  <rect x="0" y="0" width="1000" height="470" fill="#ffffff"/>

  <text x="30" y="38" font-size="18" font-weight="bold" fill="#1f2937">图 9-1　RAT 映射随指令变化</text>
  <text x="30" y="62" font-size="12.5" fill="#5F5E5A">同一个 R1 被写两次，两条 uop 拿到不同的物理寄存器，WAW 就不存在了</text>

  <!-- 表头 -->
  <text x="40" y="96" font-size="12" font-weight="bold" fill="#0C447C">进来的 uop</text>
  <text x="330" y="96" font-size="12" font-weight="bold" fill="#0C447C">RAT 表里的相关项</text>
  <text x="700" y="96" font-size="12" font-weight="bold" fill="#0C447C">物理寄存器池</text>

  <!-- 四行背景 -->
  <rect x="28" y="108" width="944" height="76" rx="9" fill="#F7F9FC" stroke="#CBD5E1"/>
  <rect x="28" y="192" width="944" height="76" rx="9" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.3"/>
  <rect x="28" y="276" width="944" height="76" rx="9" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.3"/>
  <rect x="28" y="360" width="944" height="76" rx="9" fill="#FFF4E5" stroke="#D97706" stroke-width="1.3"/>

  <!-- 行 1 初始 -->
  <text x="42" y="138" font-size="13" fill="#374151">初始状态</text>
  <text x="42" y="162" font-size="11" fill="#64748B">程序还没开始</text>
  <text x="342" y="138" font-size="13" fill="#374151">R1 → P1　　R4 → P4　　R5 → P5</text>
  <text x="342" y="162" font-size="11" fill="#64748B">Ri 对应 Pi，恒等映射</text>
  <text x="712" y="150" font-size="12" fill="#64748B">空闲表装着 P32 及以后的编号</text>

  <!-- 行 2 U1 -->
  <text x="42" y="222" font-size="13" font-weight="bold" fill="#0C447C">U1  MUL R1, R2, R3</text>
  <text x="42" y="246" font-size="11" fill="#185FA5">写 R1，分配 P10</text>
  <text x="342" y="222" font-size="13" font-weight="bold" fill="#0C447C">RAT[R1] = P10</text>
  <text x="342" y="246" font-size="11" fill="#185FA5">旧值 P1 被顶掉，先记在 ROB 里</text>
  <rect x="700" y="212" width="94" height="42" rx="8" fill="#ffffff" stroke="#185FA5" stroke-width="1.6"/>
  <text x="747" y="239" font-size="14" font-weight="bold" fill="#0C447C" text-anchor="middle">P10</text>
  <text x="812" y="239" font-size="11.5" fill="#185FA5">U1 的结果将写这里</text>

  <!-- 行 3 U2 -->
  <text x="42" y="306" font-size="13" font-weight="bold" fill="#0C447C">U2  ADD R4, R1, R5</text>
  <text x="42" y="330" font-size="11" fill="#185FA5">读 R1，拿到 P10</text>
  <text x="342" y="306" font-size="13" font-weight="bold" fill="#0C447C">RAT[R1] 仍是 P10</text>
  <text x="342" y="330" font-size="11" fill="#185FA5">U2 记下 P10，等它广播；真相关保留</text>
  <line x1="742" y1="254" x2="742" y2="296" stroke="#185FA5" stroke-width="1.6"/>
  <polygon points="742,296 737,288 747,288" fill="#185FA5"/>
  <text x="812" y="323" font-size="11.5" fill="#185FA5">U2 的操作数指向 P10</text>

  <!-- 行 4 U4 -->
  <text x="42" y="390" font-size="13" font-weight="bold" fill="#92400E">U4  ADD R1, R9, R10</text>
  <text x="42" y="414" font-size="11" fill="#B45309">也写 R1，分配 P11</text>
  <text x="342" y="390" font-size="13" font-weight="bold" fill="#92400E">RAT[R1] = P11（覆盖）</text>
  <text x="342" y="414" font-size="11" fill="#B45309">P10 还不能回收，U2 还在等它</text>
  <rect x="828" y="380" width="94" height="42" rx="8" fill="#ffffff" stroke="#D97706" stroke-width="1.6"/>
  <text x="875" y="407" font-size="14" font-weight="bold" fill="#92400E" text-anchor="middle">P11</text>
  <text x="700" y="405" font-size="11.5" fill="#B45309">U4 用另一个位置</text>

  <line x1="747" y1="298" x2="875" y2="378" stroke="#D97706" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="30" y="458" font-size="11.5" fill="#5F5E5A">要点　RAT 只记录"当下谁最新"；旧映射交给 ROB，等那条 uop 提交后才能回收</text>
</svg>
