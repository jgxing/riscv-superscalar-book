<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <title>图8-3 顺序与乱序的分界</title>
  <desc>用隧道比喻后端六站的顺序与乱序。入口的重命名和分派按序发车,入口记下每辆车的原始次序。隧道里的发射、执行、写回车辆可以随意超车。出口的提交按序驶出,照着入口记下的次序放行。ROB就是记录原始次序的账本。乱序的幅度越大,能挖的并行度越高,但出错时要撤销的状态也越多。</desc>
  <rect x="0" y="0" width="1000" height="420" fill="#ffffff"/>

  <text x="30" y="38" font-size="18" font-weight="bold" fill="#1f2937">图 8-3　顺序与乱序的分界</text>
  <text x="30" y="62" font-size="12.5" fill="#5F5E5A">入口按序发车，隧道里随意超车，出口按序驶出</text>

  <!-- 入口: 按序 -->
  <g>
    <rect x="30" y="100" width="180" height="150" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.8"/>
    <text x="120" y="128" font-size="13" font-weight="bold" fill="#0C447C" text-anchor="middle">入口　按序</text>
    <text x="120" y="152" font-size="11" fill="#185FA5" text-anchor="middle">重命名</text>
    <text x="120" y="172" font-size="11" fill="#185FA5" text-anchor="middle">分派</text>
    <line x1="50" y1="186" x2="190" y2="186" stroke="#BFD7EE"/>
    <text x="120" y="206" font-size="10" fill="#185FA5" text-anchor="middle">发车前记下</text>
    <text x="120" y="222" font-size="10" fill="#185FA5" text-anchor="middle">原始次序</text>
    <text x="120" y="240" font-size="10" font-weight="bold" fill="#0C447C" text-anchor="middle">→ ROB 账本</text>
  </g>

  <!-- 隧道: 乱序 -->
  <g>
    <rect x="222" y="100" width="556" height="150" rx="16" fill="#FFF4E5" stroke="#D97706" stroke-width="2"/>
    <text x="500" y="128" font-size="13" font-weight="bold" fill="#92400E" text-anchor="middle">隧道　乱序段</text>
    <text x="500" y="146" font-size="10.5" fill="#B45309" text-anchor="middle">发射 · 执行 · 写回——车辆可以任意超车</text>

    <!-- 车道里的 uop 卡片, 顺序被打乱 -->
    <g font-size="11" font-weight="bold" text-anchor="middle">
      <rect x="252" y="170" width="58" height="42" rx="7" fill="#ffffff" stroke="#D97706" stroke-width="1.6"/>
      <text x="281" y="196" fill="#92400E">U1</text>

      <rect x="326" y="170" width="58" height="42" rx="7" fill="#ffffff" stroke="#D97706" stroke-width="1.6"/>
      <text x="355" y="196" fill="#92400E">U3</text>

      <rect x="400" y="170" width="58" height="42" rx="7" fill="#ffffff" stroke="#D97706" stroke-width="1.6"/>
      <text x="429" y="196" fill="#92400E">U5</text>

      <rect x="474" y="170" width="58" height="42" rx="7" fill="#ffffff" stroke="#D97706" stroke-width="1.6"/>
      <text x="503" y="196" fill="#92400E">U2</text>

      <rect x="548" y="170" width="58" height="42" rx="7" fill="#ffffff" stroke="#D97706" stroke-width="1.6"/>
      <text x="577" y="196" fill="#92400E">U4</text>

      <rect x="622" y="170" width="58" height="42" rx="7" fill="#ffffff" stroke="#D97706" stroke-width="1.6"/>
      <text x="651" y="196" fill="#92400E">U6</text>

      <rect x="696" y="170" width="58" height="42" rx="7" fill="#ffffff" stroke="#D97706" stroke-width="1.6"/>
      <text x="725" y="196" fill="#92400E">U7</text>
    </g>
    <text x="500" y="236" font-size="10.5" fill="#B45309" text-anchor="middle">进入时 U1 U2 U3 U4 U5 U6 U7，隧道里次序已被打乱</text>
  </g>

  <!-- 出口: 按序 -->
  <g>
    <rect x="790" y="100" width="180" height="150" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.8"/>
    <text x="880" y="128" font-size="13" font-weight="bold" fill="#0C447C" text-anchor="middle">出口　按序</text>
    <text x="880" y="152" font-size="11" fill="#185FA5" text-anchor="middle">提交</text>
    <line x1="810" y1="166" x2="950" y2="166" stroke="#BFD7EE"/>
    <text x="880" y="188" font-size="10" fill="#185FA5" text-anchor="middle">照账本放行</text>
    <text x="880" y="206" font-size="10" fill="#185FA5" text-anchor="middle">U1 → U2 → U3</text>
    <text x="880" y="224" font-size="10" fill="#185FA5" text-anchor="middle">→ U4 → ...</text>
    <text x="880" y="242" font-size="10" font-weight="bold" fill="#0C447C" text-anchor="middle">外部看起来按序</text>
  </g>

  <!-- 进出箭头 -->
  <line x1="210" y1="175" x2="220" y2="175" stroke="#334155" stroke-width="2"/>
  <polygon points="220,175 213,171 213,179" fill="#334155"/>
  <line x1="778" y1="175" x2="788" y2="175" stroke="#334155" stroke-width="2"/>
  <polygon points="788,175 781,171 781,179" fill="#334155"/>

  <!-- 下方: 账本 -->
  <g>
    <rect x="222" y="272" width="556" height="52" rx="9" fill="#F0F5FB" stroke="#185FA5" stroke-width="1.4"/>
    <text x="500" y="294" font-size="12" font-weight="bold" fill="#0C447C" text-anchor="middle">ROB 记着每辆车的原始次序</text>
    <text x="500" y="312" font-size="10.5" fill="#185FA5" text-anchor="middle">队头没走，后面的车就算先到出口也得排队等着——账本不许跳号</text>
  </g>

  <text x="30" y="356" font-size="11" fill="#8B5E00">代价　乱序窗口越大，能挖的并行度越高，但出错时要撤销、要恢复的状态也越多</text>
  <text x="30" y="382" font-size="11" fill="#5F5E5A">隧道里怎么乱都不会撞车，因为入口记着次序，出口照着次序放行</text>
</svg>
