<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <title>图3-2 CDB 广播唤醒机制</title>
  <desc>功能部件结果连同标签放上公共数据总线广播，所有保留站监听标签，匹配者锁存数据并清除等待标志，一次唤醒所有等待者。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="340" fill="#ffffff"/>
  <text x="30" y="36" font-size="18" font-weight="bold" fill="#1f2937">图 3-2　CDB 广播唤醒所有等待者</text>

  <!-- 功能部件产出 -->
  <g>
    <rect x="30" y="70" width="200" height="64" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.2"/>
    <text x="130" y="97" font-size="14" font-weight="bold" fill="#085041" text-anchor="middle">功能部件算完</text>
    <text x="130" y="119" font-size="12.5" fill="#0F6E56" text-anchor="middle">乘法器给出结果 6</text>
  </g>
  <line x1="230" y1="102" x2="290" y2="102" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="235" y="94" font-size="11" fill="#0F6E56">打上标签 #21</text>

  <!-- CDB 总线 -->
  <g>
    <rect x="295" y="66" width="310" height="72" rx="12" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.8"/>
    <text x="450" y="94" font-size="15" font-weight="bold" fill="#633806" text-anchor="middle">CDB 公共数据总线</text>
    <text x="450" y="120" font-size="14" font-weight="bold" fill="#854F0B" text-anchor="middle">( 标签 #21 , 数据 6 )</text>
  </g>
  <text x="615" y="106" font-size="12.5" fill="#854F0B">← 结果"喊一嗓子"</text>

  <!-- 三个监听者 -->
  <g text-anchor="middle" font-size="12.5">
    <rect x="30" y="200" width="250" height="76" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.4"/>
    <text x="155" y="224" font-weight="bold" fill="#085041">保留站 #22：Qj = #21</text>
    <text x="155" y="245" fill="#0F6E56">匹配！Vj ← 6，清 Qj</text>
    <text x="155" y="265" fill="#0F6E56" font-weight="bold">操作数就绪 → 唤醒执行</text>

    <rect x="320" y="200" width="250" height="76" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.2"/>
    <text x="445" y="224" font-weight="bold" fill="#3C3489">保留站 #27：Qk = #19</text>
    <text x="445" y="245" fill="#534AB7">不匹配 → 保持等待</text>
    <text x="445" y="265" fill="#534AB7">（继续监听后续广播）</text>

    <rect x="610" y="200" width="250" height="76" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.2"/>
    <text x="735" y="224" font-weight="bold" fill="#2C2C2A">RAT 重命名表监听</text>
    <text x="735" y="245" fill="#5F5E5A">登记的标签匹配则清表项</text>
    <text x="735" y="265" fill="#5F5E5A">并把结果写入寄存器堆</text>
  </g>
  <line x1="380" y1="138" x2="200" y2="198" stroke="#BA7517" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="450" y1="138" x2="445" y2="198" stroke="#BA7517" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="520" y1="138" x2="720" y2="198" stroke="#BA7517" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="30" y="298" width="830" height="26" rx="6" fill="#FAEEDA"/>
  <text x="45" y="316" font-size="12.5" fill="#633806">这里要注意：广播是一对多的主动通知，不需要指令去轮询，一次广播就能唤醒所有在等该标签的指令。CDB 的带宽也因此成为瓶颈。</text>
</svg>
