<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <title>图12-3 load 投机执行的两种结局</title>
  <desc>load不等更老store的地址算完就先读。若后来发现地址不同则结果有效；若发现同址则报违例，load结果作废并重做。</desc>
  <rect x="0" y="0" width="1000" height="520" fill="#ffffff"/>

  <text x="30" y="38" font-size="18" font-weight="bold" fill="#1f2937">图 12-3　load 投机执行的两种结局</text>
  <text x="30" y="62" font-size="12.5" fill="#5F5E5A">先读后查。地址不同就赚了，地址相同就得重做</text>

  <!-- 结局一 -->
  <text x="30" y="98" font-size="13" font-weight="bold" fill="#1E6B40">结局一　地址不同，投机成功</text>
  <text x="30" y="130" font-size="11.5" fill="#64748B">指令</text>
  <text x="320" y="130" font-size="12" fill="#5F5E5A" text-anchor="middle">周期 N</text>
  <text x="560" y="130" font-size="12" fill="#5F5E5A" text-anchor="middle">N+1</text>
  <text x="800" y="130" font-size="12" fill="#5F5E5A" text-anchor="middle">N+2</text>

  <text x="36" y="172" font-size="12" fill="#374151">L3 load</text>
  <text x="36" y="222" font-size="12" fill="#374151">S4 store</text>

  <rect x="210" y="148" width="220" height="42" rx="6" fill="#E7F5EC" stroke="#2E8B57"/>
  <text x="320" y="175" font-size="11.5" fill="#1E6B40" text-anchor="middle">地址 0x300，投机读</text>
  <rect x="450" y="148" width="220" height="42" rx="6" fill="#E7F5EC" stroke="#2E8B57"/>
  <text x="560" y="175" font-size="11.5" fill="#1E6B40" text-anchor="middle">读到的 0x77 有效</text>
  <rect x="690" y="148" width="220" height="42" rx="6" fill="#F7F9FC" stroke="#E2E8F0"/>
  <text x="800" y="175" font-size="11.5" fill="#64748B" text-anchor="middle">正常提交</text>

  <rect x="210" y="198" width="220" height="42" rx="6" fill="#F7F9FC" stroke="#E2E8F0"/>
  <text x="320" y="225" font-size="11" fill="#94A3B8" text-anchor="middle">还没算地址</text>
  <rect x="450" y="198" width="220" height="42" rx="6" fill="#FFF7E8" stroke="#D97706"/>
  <text x="560" y="225" font-size="11.5" fill="#92400E" text-anchor="middle">地址算完是 0x400</text>
  <rect x="690" y="198" width="220" height="42" rx="6" fill="#FFF7E8" stroke="#D97706"/>
  <text x="800" y="225" font-size="11.5" fill="#92400E" text-anchor="middle">提交写内存</text>

  <text x="210" y="262" font-size="11.5" fill="#1E6B40">S4 的地址 0x400 与 L3 的 0x300 不同，L3 没有读错，什么都不用重做。</text>

  <line x1="30" y1="278" x2="970" y2="278" stroke="#E2E8F0" stroke-width="1.5" stroke-dasharray="6 5"/>

  <!-- 结局二 -->
  <text x="30" y="307" font-size="13" font-weight="bold" fill="#A93226">结局二　地址相同，违例重做</text>
  <text x="30" y="339" font-size="11.5" fill="#64748B">指令</text>
  <text x="320" y="339" font-size="12" fill="#5F5E5A" text-anchor="middle">周期 N</text>
  <text x="560" y="339" font-size="12" fill="#5F5E5A" text-anchor="middle">N+1</text>
  <text x="800" y="339" font-size="12" fill="#5F5E5A" text-anchor="middle">N+2</text>

  <text x="36" y="381" font-size="12" fill="#374151">L5 load</text>
  <text x="36" y="431" font-size="12" fill="#374151">S6 store</text>

  <rect x="210" y="357" width="220" height="42" rx="6" fill="#FCE8E6" stroke="#C0392B"/>
  <text x="320" y="384" font-size="11.5" fill="#A93226" text-anchor="middle">地址 0x500，投机读</text>
  <rect x="450" y="357" width="220" height="42" rx="6" fill="#FCE8E6" stroke="#C0392B"/>
  <text x="560" y="384" font-size="11.5" fill="#A93226" text-anchor="middle">读到旧值 0x11，错了</text>
  <rect x="690" y="357" width="220" height="42" rx="6" fill="#FCE8E6" stroke="#C0392B" stroke-width="1.8"/>
  <text x="800" y="376" font-size="11.5" font-weight="bold" fill="#A93226" text-anchor="middle">结果作废</text>
  <text x="800" y="391" font-size="10.5" fill="#A93226" text-anchor="middle">重新执行</text>

  <rect x="210" y="407" width="220" height="42" rx="6" fill="#F7F9FC" stroke="#E2E8F0"/>
  <text x="320" y="434" font-size="11" fill="#94A3B8" text-anchor="middle">还没算地址</text>
  <rect x="450" y="407" width="220" height="42" rx="6" fill="#FFF7E8" stroke="#D97706"/>
  <text x="560" y="434" font-size="11.5" fill="#92400E" text-anchor="middle">地址算完是 0x500</text>
  <rect x="690" y="407" width="220" height="42" rx="6" fill="#FFF7E8" stroke="#D97706"/>
  <text x="800" y="434" font-size="11.5" fill="#92400E" text-anchor="middle">报违例</text>

  <line x1="560" y1="405" x2="800" y2="401" stroke="#C0392B" stroke-width="1.8" stroke-dasharray="5 4"/>
  <polygon points="800,401 792,398 795,406" fill="#C0392B"/>

  <rect x="30" y="466" width="940" height="40" rx="7" fill="#F7F9FC" stroke="#CBD5E1"/>
  <text x="46" y="492" font-size="12" fill="#374151">要点　投机不是乱来，事后检查兜底。猜对省时间，猜错重做一遍，正确性始终有保证。</text>
</svg>
