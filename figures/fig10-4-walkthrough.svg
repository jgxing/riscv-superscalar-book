<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <title>图10-4 一段 uop 流过发射队列</title>
  <desc>五条 uop 依次进入发射队列。就绪的先走，等 P10 的 U2 留在队列里；等 U1 广播 P10 后，U2 在同一拍唤醒、被选中，下一拍发射。</desc>
  <rect x="0" y="0" width="1000" height="470" fill="#ffffff"/>

  <text x="30" y="38" font-size="18" font-weight="bold" fill="#1f2937">图 10-4　一段 uop 流过发射队列</text>
  <text x="30" y="62" font-size="12.5" fill="#5F5E5A">队列里只写两件事，等谁和多大年纪；其余字段在改名那站已经备好</text>

  <!-- 表头 -->
  <rect x="30" y="84" width="940" height="32" rx="6" fill="#F1F5F9" stroke="#CBD5E1"/>
  <text x="70" y="105" font-size="11.5" font-weight="bold" fill="#334155" text-anchor="middle">周期</text>
  <text x="190" y="105" font-size="11.5" font-weight="bold" fill="#334155" text-anchor="middle">新进的 uop</text>
  <text x="330" y="105" font-size="11.5" font-weight="bold" fill="#334155" text-anchor="middle">广播</text>
  <text x="565" y="105" font-size="11.5" font-weight="bold" fill="#334155" text-anchor="middle">队列里剩下的</text>
  <text x="860" y="105" font-size="11.5" font-weight="bold" fill="#334155" text-anchor="middle">发射出去</text>

  <!-- A -->
  <rect x="30" y="120" width="940" height="58" rx="5" fill="#ffffff" stroke="#E2E8F0"/>
  <text x="70" y="155" font-size="12" font-weight="bold" fill="#0C447C" text-anchor="middle">A</text>
  <text x="112" y="143" font-size="11" fill="#374151">U1 写 P10，源就绪</text>
  <text x="112" y="162" font-size="11" fill="#374151">U2 写 P12，等 P10</text>
  <text x="330" y="153" font-size="11" fill="#94A3B8" text-anchor="middle">无</text>
  <text x="400" y="143" font-size="11" fill="#185FA5">E0　U1　就绪　age0</text>
  <text x="400" y="162" font-size="11" fill="#B45309">E1　U2　等 P10　age1</text>
  <text x="860" y="153" font-size="11" fill="#185FA5" text-anchor="middle">U1 进乘法口</text>

  <!-- B -->
  <rect x="30" y="182" width="940" height="58" rx="5" fill="#F7F9FC" stroke="#E2E8F0"/>
  <text x="70" y="217" font-size="12" font-weight="bold" fill="#0C447C" text-anchor="middle">B</text>
  <text x="112" y="205" font-size="11" fill="#374151">U3 写 P13，源就绪</text>
  <text x="112" y="224" font-size="11" fill="#374151">U4 写 P11，源就绪</text>
  <text x="330" y="216" font-size="11" fill="#94A3B8" text-anchor="middle">无</text>
  <text x="400" y="205" font-size="11" fill="#B45309">E1　U2　等 P10　age1</text>
  <text x="400" y="224" font-size="11" fill="#185FA5">E2　U3　就绪　age2　　E3　U4　就绪　age3</text>
  <text x="860" y="216" font-size="11" fill="#185FA5" text-anchor="middle">U3 先走</text>

  <!-- C -->
  <rect x="30" y="244" width="940" height="58" rx="5" fill="#ffffff" stroke="#E2E8F0"/>
  <text x="70" y="279" font-size="12" font-weight="bold" fill="#0C447C" text-anchor="middle">C</text>
  <text x="112" y="267" font-size="11" fill="#374151">U5 写 P14，源就绪</text>
  <text x="112" y="286" font-size="11" fill="#64748B">后面暂时没有新 uop</text>
  <text x="330" y="278" font-size="11" fill="#94A3B8" text-anchor="middle">无</text>
  <text x="400" y="267" font-size="11" fill="#B45309">E1　U2　等 P10　age1</text>
  <text x="400" y="286" font-size="11" fill="#185FA5">E3　U4　就绪　age3　　E0　U5　就绪　age4</text>
  <text x="860" y="278" font-size="11" fill="#185FA5" text-anchor="middle">U4、U5 一起走</text>

  <!-- D -->
  <rect x="30" y="306" width="940" height="58" rx="5" fill="#FFF7E8" stroke="#D97706" stroke-width="1.3"/>
  <text x="70" y="341" font-size="12" font-weight="bold" fill="#92400E" text-anchor="middle">D</text>
  <text x="112" y="329" font-size="11" fill="#64748B">没有新 uop</text>
  <text x="112" y="348" font-size="11" fill="#92400E">U1 的乘法算完了</text>
  <text x="330" y="339" font-size="12" font-weight="bold" fill="#92400E" text-anchor="middle">P10</text>
  <text x="400" y="329" font-size="11" fill="#92400E">E1　U2　ps1 命中 P10</text>
  <text x="400" y="348" font-size="11" fill="#B45309">同一拍置就绪，也被选中</text>
  <text x="860" y="339" font-size="11" fill="#B45309" text-anchor="middle">U2 等下一拍</text>

  <!-- E -->
  <rect x="30" y="368" width="940" height="58" rx="5" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.3"/>
  <text x="70" y="403" font-size="12" font-weight="bold" fill="#0C447C" text-anchor="middle">E</text>
  <text x="112" y="391" font-size="11" fill="#64748B">队列空了</text>
  <text x="330" y="401" font-size="11" fill="#94A3B8" text-anchor="middle">无</text>
  <text x="400" y="401" font-size="11" fill="#185FA5">E1　U2　就绪，被选中后让出位置</text>
  <text x="860" y="401" font-size="11" fill="#0C447C" text-anchor="middle">U2 进 ALU</text>

  <text x="30" y="450" font-size="11.5" fill="#5F5E5A">要点　U2 从进队到发射等了好几拍，但一旦 P10 出现，它只多等一拍就能执行</text>
</svg>
