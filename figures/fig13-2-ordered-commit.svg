<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <title>图13-2 乱序写回与按序提交</title>
  <desc>U3 和 U2 先算完写回，但队头 U1 还没完成，谁都不能提交。等 U1 写完，从 head 开始连续完成的项才按程序顺序退休。</desc>
  <rect x="0" y="0" width="1000" height="470" fill="#ffffff"/>

  <text x="30" y="38" font-size="18" font-weight="bold" fill="#1f2937">图 13-2　乱序写回与按序提交</text>
  <text x="30" y="62" font-size="12.5" fill="#5F5E5A">写回可以插队，提交不能；提交永远从队头开始</text>

  <!-- 上：写回顺序 -->
  <text x="36" y="98" font-size="12.5" font-weight="bold" fill="#B45309">执行写回的顺序（乱序）</text>
  <g font-size="12">
    <rect x="36" y="110" width="150" height="46" rx="8" fill="#FFF7E8" stroke="#D97706"/>
    <text x="111" y="139" text-anchor="middle" fill="#92400E">① U3 先算完</text>

    <rect x="200" y="110" width="150" height="46" rx="8" fill="#FFF7E8" stroke="#D97706"/>
    <text x="275" y="139" text-anchor="middle" fill="#92400E">② U2 再算完</text>

    <rect x="364" y="110" width="150" height="46" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.6"/>
    <text x="439" y="139" text-anchor="middle" fill="#0C447C">③ U1 最后算完</text>

    <text x="540" y="139" font-size="12" fill="#64748B">谁先算完谁先置 done，与程序顺序无关</text>
  </g>

  <!-- 中：队头阻塞示意 -->
  <rect x="30" y="180" width="940" height="150" rx="11" fill="#F7F9FC" stroke="#CBD5E1"/>
  <text x="46" y="206" font-size="12.5" font-weight="bold" fill="#374151">某一拍的 ROB 队头</text>

  <g font-size="11.5" text-anchor="middle">
    <rect x="60" y="222" width="200" height="88" rx="8" fill="#ffffff" stroke="#D97706" stroke-width="1.8"/>
    <text x="160" y="246" font-weight="bold" fill="#B45309">head → U1</text>
    <text x="160" y="268" fill="#92400E">done = 0</text>
    <text x="160" y="290" fill="#92400E">还没写完，堵在队头</text>

    <rect x="290" y="222" width="200" height="88" rx="8" fill="#E6F1FB" stroke="#185FA5"/>
    <text x="390" y="246" font-weight="bold" fill="#0C447C">U2</text>
    <text x="390" y="268" fill="#185FA5">done = 1</text>
    <text x="390" y="290" fill="#64748B">写完了也得等</text>

    <rect x="520" y="222" width="200" height="88" rx="8" fill="#E6F1FB" stroke="#185FA5"/>
    <text x="620" y="246" font-weight="bold" fill="#0C447C">U3</text>
    <text x="620" y="268" fill="#185FA5">done = 1</text>
    <text x="620" y="290" fill="#64748B">写完了也得等</text>

    <text x="790" y="252" font-size="12" font-weight="bold" fill="#B45309">提交数 = 0</text>
    <text x="790" y="276" font-size="11.5" fill="#92400E">队头没好</text>
    <text x="790" y="296" font-size="11.5" fill="#92400E">后面全停</text>
  </g>

  <!-- 下：提交顺序 -->
  <text x="36" y="360" font-size="12.5" font-weight="bold" fill="#0C447C">U1 写完后的提交顺序（按序）</text>
  <g font-size="12">
    <rect x="36" y="374" width="180" height="48" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.8"/>
    <text x="126" y="404" text-anchor="middle" font-weight="bold" fill="#0C447C">第 1 批　U1 + U2</text>

    <rect x="230" y="374" width="180" height="48" rx="8" fill="#E6F1FB" stroke="#185FA5"/>
    <text x="320" y="404" text-anchor="middle" fill="#0C447C">第 2 批　U3</text>

    <text x="436" y="403" font-size="11.5" fill="#64748B">head 逐批前移，提交宽度本例为 2</text>
  </g>

  <text x="30" y="452" font-size="11.5" fill="#8B5E00">要点　提交是顺序与乱序的分界线，跨过它，机器的状态才算真正改变</text>
</svg>
