<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <title>图4-2 紧耦合与解耦取指的对比</title>
  <desc>紧耦合时取指必须等预测器算出结果，预测器慢就在流水线上产生气泡；解耦后预测器独立向前跑，把地址填入FTQ，取指从队头取地址，两者各跑各的，速度差由FTQ吸收。</desc>
  <rect x="0" y="0" width="980" height="560" fill="#ffffff"/>

  <text x="30" y="40" font-size="18" font-weight="bold" fill="#1f2937">图 4-2　紧耦合与解耦取指的对比</text>
  <text x="30" y="64" font-size="12.5" fill="#5F5E5A">同样是复杂的预测器，放在关键路径上会拖慢取指，拆开后就不会</text>

  <!-- 左：紧耦合 -->
  <g>
    <rect x="30" y="90" width="450" height="380" rx="12" fill="#FCECEC" stroke="#A32D2D" stroke-width="1.4"/>
    <text x="255" y="122" font-size="15" font-weight="bold" fill="#A32D2D" text-anchor="middle">紧耦合　取指要等预测结果</text>

    <!-- 模块链 -->
    <rect x="52" y="150" width="80" height="52" rx="8" fill="#fff" stroke="#9CA3AF" stroke-width="1.4"/>
    <text x="92" y="182" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">PC</text>

    <rect x="178" y="150" width="140" height="52" rx="8" fill="#F7C1C1" stroke="#A32D2D" stroke-width="1.6"/>
    <text x="248" y="172" font-size="12" font-weight="bold" fill="#7a2020" text-anchor="middle">预测器</text>
    <text x="248" y="190" font-size="10.5" fill="#A32D2D" text-anchor="middle">复杂，要好几拍</text>

    <rect x="364" y="150" width="94" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.4"/>
    <text x="411" y="182" font-size="12" font-weight="bold" fill="#0C447C" text-anchor="middle">取指</text>

    <line x1="132" y1="176" x2="174" y2="176" stroke="#9CA3AF" stroke-width="1.8"/>
    <polygon points="174,176 166,171 166,181" fill="#9CA3AF"/>
    <line x1="318" y1="176" x2="360" y2="176" stroke="#A32D2D" stroke-width="1.8"/>
    <polygon points="360,176 352,171 352,181" fill="#A32D2D"/>
    <text x="339" y="166" font-size="10" fill="#A32D2D" text-anchor="middle">等</text>

    <!-- 节拍示意 -->
    <text x="52" y="240" font-size="11.5" fill="#5F5E5A">时间 →</text>
    <text x="52" y="272" font-size="11" fill="#7a2020">预测器</text>
    <text x="52" y="312" font-size="11" fill="#0C447C">取指</text>

    <!-- 预测器忙碌格 -->
    <g>
      <rect x="120" y="258" width="50" height="22" rx="4" fill="#F7C1C1" stroke="#A32D2D"/>
      <rect x="174" y="258" width="50" height="22" rx="4" fill="#F7C1C1" stroke="#A32D2D"/>
      <rect x="228" y="258" width="50" height="22" rx="4" fill="#F7C1C1" stroke="#A32D2D"/>
      <rect x="282" y="258" width="50" height="22" rx="4" fill="#E6F1FB" stroke="#185FA5"/>
      <rect x="336" y="258" width="50" height="22" rx="4" fill="#E6F1FB" stroke="#185FA5"/>
      <rect x="390" y="258" width="50" height="22" rx="4" fill="#E6F1FB" stroke="#185FA5"/>
    </g>
    <!-- 取指：前三拍气泡 -->
    <g>
      <rect x="120" y="298" width="50" height="22" rx="4" fill="#F3F4F6" stroke="#9CA3AF" stroke-dasharray="3 2"/>
      <rect x="174" y="298" width="50" height="22" rx="4" fill="#F3F4F6" stroke="#9CA3AF" stroke-dasharray="3 2"/>
      <rect x="228" y="298" width="50" height="22" rx="4" fill="#F3F4F6" stroke="#9CA3AF" stroke-dasharray="3 2"/>
      <rect x="282" y="298" width="50" height="22" rx="4" fill="#B7E4CD" stroke="#0F6E56"/>
      <rect x="336" y="298" width="50" height="22" rx="4" fill="#B7E4CD" stroke="#0F6E56"/>
      <rect x="390" y="298" width="50" height="22" rx="4" fill="#B7E4CD" stroke="#0F6E56"/>
    </g>
    <text x="197" y="314" font-size="10" fill="#6B7280" text-anchor="middle">气泡</text>

    <rect x="52" y="352" width="406" height="94" rx="8" fill="#fff" stroke="#A32D2D" stroke-dasharray="4 3"/>
    <text x="70" y="380" font-size="12.5" font-weight="bold" fill="#A32D2D">预测器算的时候，取指只能空等</text>
    <text x="70" y="406" font-size="12" fill="#2C2C2A">想让预测更准，就得把预测器做得更大更慢，</text>
    <text x="70" y="428" font-size="12" fill="#2C2C2A">结果反而拖垮取指。准确性与速度直接打架。</text>
  </g>

  <!-- 右：解耦 -->
  <g>
    <rect x="500" y="90" width="450" height="380" rx="12" fill="#F1F8F4" stroke="#0F6E56" stroke-width="1.4"/>
    <text x="725" y="122" font-size="15" font-weight="bold" fill="#0F6E56" text-anchor="middle">解耦　两者各跑各的</text>

    <!-- 模块链 -->
    <rect x="518" y="150" width="112" height="52" rx="8" fill="#EDE9FE" stroke="#6D5BD0" stroke-width="1.6"/>
    <text x="574" y="172" font-size="12" font-weight="bold" fill="#4C1D95" text-anchor="middle">预测器</text>
    <text x="574" y="190" font-size="10.5" fill="#5B21B6" text-anchor="middle">独立向前跑</text>

    <rect x="664" y="150" width="96" height="52" rx="8" fill="#DDD6FE" stroke="#6D5BD0" stroke-width="1.6"/>
    <text x="712" y="172" font-size="12" font-weight="bold" fill="#4C1D95" text-anchor="middle">FTQ</text>
    <text x="712" y="190" font-size="10.5" fill="#5B21B6" text-anchor="middle">缓冲地址</text>

    <rect x="794" y="150" width="94" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.4"/>
    <text x="841" y="182" font-size="12" font-weight="bold" fill="#0C447C" text-anchor="middle">取指</text>

    <line x1="630" y1="176" x2="660" y2="176" stroke="#6D5BD0" stroke-width="1.8"/>
    <polygon points="660,176 652,171 652,181" fill="#6D5BD0"/>
    <line x1="760" y1="176" x2="790" y2="176" stroke="#6D5BD0" stroke-width="1.8"/>
    <polygon points="790,176 782,171 782,181" fill="#6D5BD0"/>

    <!-- 节拍示意 -->
    <text x="518" y="240" font-size="11.5" fill="#5F5E5A">时间 →</text>
    <text x="518" y="272" font-size="11" fill="#5B21B6">预测器</text>
    <text x="518" y="312" font-size="11" fill="#0C447C">取指</text>

    <g>
      <rect x="586" y="258" width="50" height="22" rx="4" fill="#DDD6FE" stroke="#6D5BD0"/>
      <rect x="640" y="258" width="50" height="22" rx="4" fill="#DDD6FE" stroke="#6D5BD0"/>
      <rect x="694" y="258" width="50" height="22" rx="4" fill="#DDD6FE" stroke="#6D5BD0"/>
      <rect x="748" y="258" width="50" height="22" rx="4" fill="#DDD6FE" stroke="#6D5BD0"/>
      <rect x="802" y="258" width="50" height="22" rx="4" fill="#DDD6FE" stroke="#6D5BD0"/>
      <rect x="856" y="258" width="50" height="22" rx="4" fill="#DDD6FE" stroke="#6D5BD0"/>
    </g>
    <g>
      <rect x="586" y="298" width="50" height="22" rx="4" fill="#F3F4F6" stroke="#9CA3AF" stroke-dasharray="3 2"/>
      <rect x="640" y="298" width="50" height="22" rx="4" fill="#B7E4CD" stroke="#0F6E56"/>
      <rect x="694" y="298" width="50" height="22" rx="4" fill="#B7E4CD" stroke="#0F6E56"/>
      <rect x="748" y="298" width="50" height="22" rx="4" fill="#B7E4CD" stroke="#0F6E56"/>
      <rect x="802" y="298" width="50" height="22" rx="4" fill="#B7E4CD" stroke="#0F6E56"/>
      <rect x="856" y="298" width="50" height="22" rx="4" fill="#B7E4CD" stroke="#0F6E56"/>
    </g>
    <text x="611" y="314" font-size="10" fill="#6B7280" text-anchor="middle">起步</text>

    <rect x="518" y="352" width="406" height="94" rx="8" fill="#fff" stroke="#0F6E56" stroke-dasharray="4 3"/>
    <text x="536" y="380" font-size="12.5" font-weight="bold" fill="#0F6E56">FTQ 填平了速度差</text>
    <text x="536" y="406" font-size="12" fill="#2C2C2A">预测器只管往前填地址，取指只管从队头拿。</text>
    <text x="536" y="428" font-size="12" fill="#2C2C2A">取指不再等预测，预测器也能做得更大更准。</text>
  </g>

  <!-- 底部结论 -->
  <rect x="30" y="496" width="920" height="48" rx="10" fill="#FAFAF9" stroke="#D1D5DB" stroke-width="1.2"/>
  <text x="50" y="526" font-size="12.5" fill="#3C3489">解耦的代价是把时序问题换成了状态一致性问题，第 4.7 节会说明。</text>
</svg>
