<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <title>图11-2 有旁路与无旁路的连续相关指令</title>
  <desc>A1的结果A2马上要用。没有旁路时A2要等生产者写回，多出一个气泡；有旁路时生产者出结果的下一拍A2就能带着新值执行。</desc>
  <rect x="0" y="0" width="1000" height="500" fill="#ffffff"/>

  <text x="30" y="38" font-size="18" font-weight="bold" fill="#1f2937">图 11-2　有旁路与无旁路的连续相关指令</text>
  <text x="30" y="62" font-size="12.5" fill="#5F5E5A">两条加法背靠背，A2 等的正是 A1 的结果 P10</text>

  <!-- 上半：无旁路 -->
  <text x="30" y="98" font-size="13" font-weight="bold" fill="#B45309">没有旁路</text>
  <text x="30" y="130" font-size="11.5" fill="#64748B">指令</text>
  <text x="295" y="130" font-size="12" fill="#5F5E5A" text-anchor="middle">周期 N</text>
  <text x="475" y="130" font-size="12" fill="#5F5E5A" text-anchor="middle">N+1</text>
  <text x="655" y="130" font-size="12" fill="#5F5E5A" text-anchor="middle">N+2</text>
  <text x="835" y="130" font-size="12" fill="#5F5E5A" text-anchor="middle">N+3</text>

  <text x="36" y="177" font-size="12" fill="#374151">A1 生产者</text>
  <text x="36" y="225" font-size="12" fill="#374151">A2 消费者</text>

  <rect x="210" y="148" width="170" height="42" rx="6" fill="#FFF7E8" stroke="#D97706"/>
  <text x="295" y="175" font-size="12" fill="#92400E" text-anchor="middle">ALU 算出 P10</text>
  <rect x="390" y="148" width="170" height="42" rx="6" fill="#E6F1FB" stroke="#185FA5"/>
  <text x="475" y="175" font-size="12" fill="#0C447C" text-anchor="middle">写回寄存器堆</text>
  <rect x="570" y="148" width="170" height="42" rx="6" fill="#F7F9FC" stroke="#E2E8F0"/>
  <rect x="750" y="148" width="170" height="42" rx="6" fill="#F7F9FC" stroke="#E2E8F0"/>

  <rect x="210" y="196" width="170" height="42" rx="6" fill="#F7F9FC" stroke="#E2E8F0"/>
  <text x="295" y="223" font-size="11.5" fill="#94A3B8" text-anchor="middle">等 P10</text>
  <rect x="390" y="196" width="170" height="42" rx="6" fill="#FCE8E6" stroke="#C0392B" stroke-width="1.6"/>
  <text x="475" y="216" font-size="11.5" font-weight="bold" fill="#A93226" text-anchor="middle">气泡</text>
  <text x="475" y="231" font-size="10.5" fill="#A93226" text-anchor="middle">写回同拍读不到新值</text>
  <rect x="570" y="196" width="170" height="42" rx="6" fill="#E6F1FB" stroke="#185FA5"/>
  <text x="655" y="223" font-size="12" fill="#0C447C" text-anchor="middle">发射并 ALU 执行</text>
  <rect x="750" y="196" width="170" height="42" rx="6" fill="#E6F1FB" stroke="#185FA5"/>
  <text x="835" y="223" font-size="12" fill="#0C447C" text-anchor="middle">写回</text>

  <!-- 分隔线 -->
  <line x1="30" y1="264" x2="970" y2="264" stroke="#E2E8F0" stroke-width="1.5" stroke-dasharray="6 5"/>

  <!-- 下半：有旁路 -->
  <text x="30" y="295" font-size="13" font-weight="bold" fill="#1E6B40">有旁路</text>
  <text x="30" y="327" font-size="11.5" fill="#64748B">指令</text>
  <text x="295" y="327" font-size="12" fill="#5F5E5A" text-anchor="middle">周期 N</text>
  <text x="475" y="327" font-size="12" fill="#5F5E5A" text-anchor="middle">N+1</text>
  <text x="655" y="327" font-size="12" fill="#5F5E5A" text-anchor="middle">N+2</text>
  <text x="835" y="327" font-size="12" fill="#5F5E5A" text-anchor="middle">N+3</text>

  <text x="36" y="374" font-size="12" fill="#374151">A1 生产者</text>
  <text x="36" y="422" font-size="12" fill="#374151">A2 消费者</text>

  <rect x="210" y="345" width="170" height="42" rx="6" fill="#FFF7E8" stroke="#D97706"/>
  <text x="295" y="372" font-size="11.5" fill="#92400E" text-anchor="middle">算出 P10 并上旁路</text>
  <rect x="390" y="345" width="170" height="42" rx="6" fill="#E6F1FB" stroke="#185FA5"/>
  <text x="475" y="372" font-size="12" fill="#0C447C" text-anchor="middle">写回寄存器堆</text>
  <rect x="570" y="345" width="170" height="42" rx="6" fill="#F7F9FC" stroke="#E2E8F0"/>
  <rect x="750" y="345" width="170" height="42" rx="6" fill="#F7F9FC" stroke="#E2E8F0"/>

  <rect x="210" y="393" width="170" height="42" rx="6" fill="#F7F9FC" stroke="#E2E8F0"/>
  <text x="295" y="420" font-size="11.5" fill="#94A3B8" text-anchor="middle">等 P10</text>
  <rect x="390" y="393" width="170" height="42" rx="6" fill="#E7F5EC" stroke="#2E8B57" stroke-width="2"/>
  <text x="475" y="412" font-size="11.5" font-weight="bold" fill="#1E6B40" text-anchor="middle">旁路命中</text>
  <text x="475" y="427" font-size="10.5" fill="#1E6B40" text-anchor="middle">带新值发射并 ALU 执行</text>
  <rect x="570" y="393" width="170" height="42" rx="6" fill="#E7F5EC" stroke="#2E8B57"/>
  <text x="655" y="420" font-size="12" fill="#1E6B40" text-anchor="middle">写回</text>
  <rect x="750" y="393" width="170" height="42" rx="6" fill="#F7F9FC" stroke="#E2E8F0"/>

  <line x1="475" y1="345" x2="475" y2="391" stroke="#2E8B57" stroke-width="1.8" stroke-dasharray="5 4"/>
  <polygon points="475,391 471,383 479,383" fill="#2E8B57"/>

  <rect x="30" y="455" width="940" height="32" rx="7" fill="#F7F9FC" stroke="#CBD5E1"/>
  <text x="46" y="477" font-size="12" fill="#374151">要点　旁路省下的是生产者写回与消费者读源之间的那一拍，连续相关指令才能背靠背执行</text>
</svg>
