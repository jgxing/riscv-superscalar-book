<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <title>图6-1 取指单元的全景数据流</title>
  <desc>取指单元从FTQ拿到取指目标地址，经ICache取出指令字，预译码为每条指令附上分支等边带信息，最后指令字与边带信息一起存入指令缓冲队列，供译码和后端取用。ICache、预译码、指令缓冲是本章的三个关键站点。</desc>
  <rect x="0" y="0" width="980" height="470" fill="#ffffff"/>

  <text x="30" y="40" font-size="18" font-weight="bold" fill="#1f2937">图 6-1　取指单元的全景数据流</text>
  <text x="30" y="64" font-size="12.5" fill="#5F5E5A">从 FTQ 的地址到后端的指令，中间经过三个关键站点</text>

  <!-- 主流程背景带 -->
  <rect x="28" y="96" width="924" height="230" rx="12" fill="#F7F9FC" stroke="#C9D4E2" stroke-width="1.2"/>
  <text x="44" y="118" font-size="12" font-weight="bold" fill="#334155">取指流水线（顺序）</text>

  <!-- FTQ -->
  <g>
    <rect x="46" y="150" width="140" height="86" rx="9" fill="#DDD6FE" stroke="#6D5BD0" stroke-width="1.8"/>
    <text x="116" y="182" font-size="14" font-weight="bold" fill="#4C1D95" text-anchor="middle">FTQ</text>
    <text x="116" y="204" font-size="11" fill="#5B21B6" text-anchor="middle">取指目标队列</text>
    <text x="116" y="222" font-size="11" fill="#5B21B6" text-anchor="middle">装的是地址</text>
  </g>

  <!-- ICache -->
  <g>
    <rect x="248" y="150" width="150" height="86" rx="9" fill="#FCE8E6" stroke="#C0392B" stroke-width="2"/>
    <text x="323" y="180" font-size="14" font-weight="bold" fill="#922B21" text-anchor="middle">ICache</text>
    <text x="323" y="202" font-size="11" fill="#A93226" text-anchor="middle">给地址出指令字</text>
    <text x="323" y="220" font-size="11" fill="#A93226" text-anchor="middle">命中 / 缺失</text>
    <circle cx="386" cy="162" r="6" fill="#C0392B"/>
  </g>

  <!-- 预译码 -->
  <g>
    <rect x="458" y="150" width="150" height="86" rx="9" fill="#FCE8E6" stroke="#C0392B" stroke-width="2"/>
    <text x="533" y="180" font-size="14" font-weight="bold" fill="#922B21" text-anchor="middle">预译码</text>
    <text x="533" y="202" font-size="11" fill="#A93226" text-anchor="middle">粗识别分支类型</text>
    <text x="533" y="220" font-size="11" fill="#A93226" text-anchor="middle">附边带信息</text>
    <circle cx="596" cy="162" r="6" fill="#C0392B"/>
  </g>

  <!-- 指令缓冲 -->
  <g>
    <rect x="668" y="150" width="160" height="86" rx="9" fill="#FCE8E6" stroke="#C0392B" stroke-width="2"/>
    <text x="748" y="180" font-size="14" font-weight="bold" fill="#922B21" text-anchor="middle">指令缓冲队列</text>
    <text x="748" y="202" font-size="11" fill="#A93226" text-anchor="middle">存指令字 + 边带位</text>
    <text x="748" y="220" font-size="11" fill="#A93226" text-anchor="middle">吸收速度差</text>
    <circle cx="816" cy="162" r="6" fill="#C0392B"/>
  </g>

  <!-- 后端 -->
  <g>
    <rect x="878" y="150" width="60" height="86" rx="9" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.8"/>
    <text x="908" y="186" font-size="13" font-weight="bold" fill="#0C447C" text-anchor="middle">译码</text>
    <text x="908" y="206" font-size="13" font-weight="bold" fill="#0C447C" text-anchor="middle">→</text>
    <text x="908" y="224" font-size="11" fill="#185FA5" text-anchor="middle">后端</text>
  </g>

  <!-- 箭头 -->
  <line x1="186" y1="193" x2="246" y2="193" stroke="#334155" stroke-width="2"/>
  <polygon points="246,193 236,188 236,198" fill="#334155"/>
  <text x="216" y="185" font-size="10.5" fill="#475569" text-anchor="middle">地址</text>

  <line x1="398" y1="193" x2="456" y2="193" stroke="#334155" stroke-width="2"/>
  <polygon points="456,193 446,188 446,198" fill="#334155"/>
  <text x="427" y="185" font-size="10.5" fill="#475569" text-anchor="middle">指令字</text>

  <line x1="608" y1="193" x2="666" y2="193" stroke="#334155" stroke-width="2"/>
  <polygon points="666,193 656,188 656,198" fill="#334155"/>
  <text x="637" y="185" font-size="10.5" fill="#475569" text-anchor="middle">包裹</text>

  <line x1="828" y1="193" x2="876" y2="193" stroke="#334155" stroke-width="2"/>
  <polygon points="876,193 866,188 866,198" fill="#334155"/>
  <text x="852" y="185" font-size="10.5" fill="#475569" text-anchor="middle">取用</text>

  <!-- 三个要求的说明 -->
  <g font-size="12" fill="#5F5E5A">
    <rect x="46" y="278" width="220" height="34" rx="7" fill="#ffffff" stroke="#E0D6F8" stroke-width="1"/>
    <text x="156" y="300" text-anchor="middle">快　每周期供上多条指令</text>

    <rect x="322" y="278" width="286" height="34" rx="7" fill="#ffffff" stroke="#F6C9C5" stroke-width="1"/>
    <text x="465" y="300" text-anchor="middle">准　预译码尽早发现预测错误</text>

    <rect x="664" y="278" width="286" height="34" rx="7" fill="#ffffff" stroke="#F6C9C5" stroke-width="1"/>
    <text x="807" y="300" text-anchor="middle">稳　缓冲吸收前后端速度差</text>
  </g>

  <!-- 底部提示 -->
  <rect x="28" y="356" width="924" height="88" rx="10" fill="#F1F8F4" stroke="#0F6E56" stroke-width="1.2"/>
  <text x="46" y="382" font-size="12.5" font-weight="bold" fill="#0F6E56">本章的三个关键站点</text>
  <text x="46" y="406" font-size="12" fill="#2C2C2A">ICache 把取指变快　·　预译码把错误发现提前　·　指令缓冲把速度差吸收掉</text>
  <text x="46" y="428" font-size="12" fill="#2C2C2A">三者合起来，让后端既吃不缺、也不吃错</text>
</svg>
