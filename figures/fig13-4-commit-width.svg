<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <title>图13-4 提交宽度与退休</title>
  <desc>提交宽度是每拍能退休的指令数，要和重命名、发射宽度匹配。窄了浪费后端算力，宽了增加时钟负担。store 也在提交时真正写内存。</desc>
  <rect x="0" y="0" width="1000" height="440" fill="#ffffff"/>

  <text x="30" y="38" font-size="18" font-weight="bold" fill="#1f2937">图 13-4　提交宽度与退休</text>
  <text x="30" y="62" font-size="12.5" fill="#5F5E5A">退休是 uop 离开机器的最后一站，宽度要和前面各站配得上</text>

  <!-- 左：一条 uop 的最后一程 -->
  <text x="36" y="98" font-size="12.5" font-weight="bold" fill="#0C447C">退休时做三件事</text>
  <g font-size="12">
    <rect x="36" y="110" width="290" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5"/>
    <text x="52" y="142" fill="#0C447C">① 结果写入架构状态</text>

    <rect x="36" y="172" width="290" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5"/>
    <text x="52" y="204" fill="#0C447C">② store 真正写进内存</text>

    <rect x="36" y="234" width="290" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5"/>
    <text x="52" y="266" fill="#0C447C">③ 释放 old_pd 给空闲表</text>
  </g>

  <!-- 中：宽度匹配 -->
  <text x="370" y="98" font-size="12.5" font-weight="bold" fill="#374151">各站宽度要匹配</text>
  <g font-size="12" text-anchor="middle">
    <rect x="370" y="112" width="130" height="48" rx="8" fill="#F7F9FC" stroke="#94A3B8"/>
    <text x="435" y="142" fill="#475569">重命名 2</text>
    <text x="512" y="142" fill="#64748B" text-anchor="start">→</text>

    <rect x="528" y="112" width="130" height="48" rx="8" fill="#F7F9FC" stroke="#94A3B8"/>
    <text x="593" y="142" fill="#475569">发射 2</text>
    <text x="670" y="142" fill="#64748B" text-anchor="start">→</text>

    <rect x="686" y="112" width="130" height="48" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.8"/>
    <text x="751" y="142" font-weight="bold" fill="#0C447C">提交 2</text>
    <text x="836" y="142" font-size="11" fill="#64748B" text-anchor="start">齐了</text>
  </g>

  <!-- 宽度对比 -->
  <g font-size="11.5">
    <rect x="370" y="184" width="440" height="52" rx="8" fill="#FFF7E8" stroke="#D97706"/>
    <text x="386" y="206" fill="#B45309">提交宽度太窄</text>
    <text x="386" y="225" fill="#92400E">退休跟不上执行，ROB 很快被占满，前端跟着停</text>

    <rect x="370" y="248" width="440" height="52" rx="8" fill="#FFF7E8" stroke="#D97706"/>
    <text x="386" y="270" fill="#B45309">提交宽度太宽</text>
    <text x="386" y="289" fill="#92400E">要同时查更多表项、释放更多寄存器，时钟反而变慢</text>
  </g>

  <!-- 底部结论 -->
  <rect x="36" y="320" width="920" height="76" rx="10" fill="#F7F9FC" stroke="#CBD5E1"/>
  <text x="56" y="346" font-size="12.5" font-weight="bold" fill="#374151">ROB 深度也要配套</text>
  <text x="56" y="370" font-size="11.5" fill="#374151">深 ROB 藏得住更多在飞指令，扛得住长延迟访存，但面积、提交逻辑和恢复开销一起涨。</text>
  <text x="56" y="390" font-size="11.5" fill="#64748B">教学核取八项只为看清机制，真实核通常是它的几十倍。</text>

  <text x="30" y="424" font-size="11.5" fill="#8B5E00">要点　提交宽度是流水线的出口，出口太细，前面修再宽也只是堵在门口</text>
</svg>
