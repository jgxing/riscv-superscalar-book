<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <title>图7-1 译码阶段的全景</title>
  <desc>指令从指令缓冲队列取出,进入译码器。译码器做三件事:普通指令一对一直译,复杂指令拆成多条uop,相邻指令对融合成一条uop。译出的uop经过一级整理缓冲变成稳定流,送往后端的重命名与分派。译码器是纯组合逻辑,融合所需的上一条指令由外部寄存器提供。</desc>
  <rect x="0" y="0" width="980" height="470" fill="#ffffff"/>

  <text x="30" y="40" font-size="18" font-weight="bold" fill="#1f2937">图 7-1　译码阶段的全景</text>
  <text x="30" y="64" font-size="12.5" fill="#5F5E5A">译码把 ISA 指令翻译成后端能执行的 uop，拆分与融合都发生在这一步</text>

  <!-- 主流程背景 -->
  <rect x="28" y="92" width="924" height="250" rx="12" fill="#F7F9FC" stroke="#C9D4E2" stroke-width="1.2"/>

  <!-- 指令缓冲 -->
  <g>
    <rect x="46" y="170" width="140" height="80" rx="9" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.8"/>
    <text x="116" y="200" font-size="13" font-weight="bold" fill="#0C447C" text-anchor="middle">指令缓冲队列</text>
    <text x="116" y="222" font-size="11" fill="#185FA5" text-anchor="middle">装指令字 + 预译码位</text>
    <text x="116" y="238" font-size="10.5" fill="#185FA5" text-anchor="middle">来自第 6 章</text>
  </g>

  <!-- 译码器 -->
  <g>
    <rect x="248" y="150" width="180" height="120" rx="9" fill="#FEF9E7" stroke="#D4AC0D" stroke-width="2"/>
    <text x="338" y="178" font-size="15" font-weight="bold" fill="#7D6608" text-anchor="middle">译码器</text>
    <text x="338" y="200" font-size="11" fill="#9A7D0A" text-anchor="middle">纯组合逻辑，无时钟</text>
    <line x1="264" y1="212" x2="412" y2="212" stroke="#E8D9A0" stroke-width="1"/>
    <text x="338" y="232" font-size="11" fill="#7D6608" text-anchor="middle">直译　拆分　融合</text>
    <text x="338" y="252" font-size="10.5" fill="#9A7D0A" text-anchor="middle">把复杂度揽在自己身上</text>
  </g>

  <!-- 上一条指令寄存器(融合用) -->
  <g>
    <rect x="248" y="300" width="180" height="34" rx="7" fill="#F5F3FF" stroke="#6D5BD0" stroke-width="1.4"/>
    <text x="338" y="322" font-size="11" fill="#5B21B6" text-anchor="middle">上一条指令寄存器（供融合）</text>
    <line x1="338" y1="300" x2="338" y2="272" stroke="#6D5BD0" stroke-width="1.6" stroke-dasharray="4 3"/>
    <polygon points="338,272 333,282 343,282" fill="#6D5BD0"/>
  </g>

  <!-- uop 整理缓冲 -->
  <g>
    <rect x="496" y="170" width="150" height="80" rx="9" fill="#F1F8F4" stroke="#0F6E56" stroke-width="1.8"/>
    <text x="571" y="198" font-size="13" font-weight="bold" fill="#0F6E56" text-anchor="middle">uop 整理缓冲</text>
    <text x="571" y="220" font-size="11" fill="#0F6E56" text-anchor="middle">吸收数量波动</text>
    <text x="571" y="236" font-size="10.5" fill="#0F6E56" text-anchor="middle">理成稳定 uop 流</text>
  </g>

  <!-- 后端 -->
  <g>
    <rect x="720" y="158" width="212" height="104" rx="9" fill="#EDE9FE" stroke="#6D5BD0" stroke-width="1.8"/>
    <text x="826" y="184" font-size="13" font-weight="bold" fill="#4C1D95" text-anchor="middle">后端</text>
    <text x="826" y="208" font-size="11.5" fill="#5B21B6" text-anchor="middle">寄存器重命名 → 分派</text>
    <text x="826" y="228" font-size="11.5" fill="#5B21B6" text-anchor="middle">→ 发射 → 执行</text>
    <text x="826" y="248" font-size="10.5" fill="#5B21B6" text-anchor="middle">执行的是 uop，不是 ISA 指令</text>
  </g>

  <!-- 箭头 -->
  <line x1="186" y1="210" x2="246" y2="210" stroke="#334155" stroke-width="2"/>
  <polygon points="246,210 236,205 236,215" fill="#334155"/>
  <text x="216" y="202" font-size="10" fill="#475569" text-anchor="middle">指令</text>

  <line x1="428" y1="210" x2="494" y2="210" stroke="#334155" stroke-width="2"/>
  <polygon points="494,210 484,205 484,215" fill="#334155"/>
  <text x="461" y="202" font-size="10" fill="#475569" text-anchor="middle">uop</text>

  <line x1="646" y1="210" x2="718" y2="210" stroke="#334155" stroke-width="2"/>
  <polygon points="718,210 708,205 708,215" fill="#334155"/>
  <text x="682" y="202" font-size="10" fill="#475569" text-anchor="middle">稳定流</text>

  <!-- 底部三件事说明 -->
  <g font-size="12" fill="#2C2C2A">
    <rect x="46" y="370" width="286" height="72" rx="9" fill="#E6F1FB" stroke="#7FB2DC" stroke-width="1.2"/>
    <text x="60" y="392" font-size="12.5" font-weight="bold" fill="#0C447C">直译</text>
    <text x="60" y="412" font-size="11" fill="#185FA5">一条简单指令 → 一条 uop</text>
    <text x="60" y="430" font-size="11" fill="#185FA5">大多数指令走这条路</text>

    <rect x="347" y="370" width="286" height="72" rx="9" fill="#FEF5F4" stroke="#E6B0AA" stroke-width="1.2"/>
    <text x="361" y="392" font-size="12.5" font-weight="bold" fill="#922B21">拆分</text>
    <text x="361" y="412" font-size="11" fill="#A93226">一条复杂指令 → 多条 uop</text>
    <text x="361" y="430" font-size="11" fill="#A93226">如 32 位通路上的双字存储</text>

    <rect x="648" y="370" width="286" height="72" rx="9" fill="#F1F8F4" stroke="#A9D5C0" stroke-width="1.2"/>
    <text x="662" y="392" font-size="12.5" font-weight="bold" fill="#0F6E56">融合</text>
    <text x="662" y="412" font-size="11" fill="#0E6655">多条简单指令 → 一条 uop</text>
    <text x="662" y="430" font-size="11" fill="#0E6655">如 lui + addi</text>
  </g>
</svg>
