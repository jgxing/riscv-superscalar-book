<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <title>图1-3 多发射与乱序的分工</title>
  <desc>多发射拓宽每周期进入的指令数，解决吞吐宽度问题；乱序挖出可提前执行的指令，解决等待浪费问题。两者配合才能把 CPI 压下去。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="540" fill="#ffffff"/>

  <text x="30" y="40" font-size="18" font-weight="bold" fill="#1f2937">图 1-3　多发射与乱序的分工</text>
  <text x="30" y="64" font-size="12.5" fill="#5F5E5A">两条路解决不同问题，要配合才能压低 CPI</text>

  <!-- 起点 -->
  <rect x="40" y="230" width="150" height="76" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.2"/>
  <text x="115" y="262" font-size="14" font-weight="bold" fill="#2C2C2A" text-anchor="middle">顺序单发射</text>
  <text x="115" y="286" font-size="12" fill="#5F5E5A" text-anchor="middle">IPC ≤ 1</text>

  <!-- 上路：多发射 -->
  <line x1="190" y1="255" x2="280" y2="140" stroke="#185FA5" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="285" y="96" width="270" height="96" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.2"/>
  <text x="420" y="126" font-size="15" font-weight="bold" fill="#0C447C" text-anchor="middle">多发射</text>
  <text x="420" y="150" font-size="12.5" fill="#185FA5" text-anchor="middle">拓宽每个周期进入的指令数</text>
  <text x="420" y="172" font-size="12" fill="#185FA5" text-anchor="middle">单车道 → 多车道</text>
  <text x="420" y="216" font-size="11.5" fill="#A32D2D" text-anchor="middle">只做它：通道变宽，但前面一停，各车道跟着停</text>

  <!-- 下路：乱序 -->
  <line x1="190" y1="285" x2="280" y2="400" stroke="#534AB7" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="285" y="356" width="270" height="96" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.2"/>
  <text x="420" y="386" font-size="15" font-weight="bold" fill="#3C3489" text-anchor="middle">乱序执行</text>
  <text x="420" y="410" font-size="12.5" fill="#534AB7" text-anchor="middle">让就绪指令越过等待提前执行</text>
  <text x="420" y="432" font-size="12" fill="#534AB7" text-anchor="middle">挖出程序里的 ILP</text>
  <text x="420" y="476" font-size="11.5" fill="#A32D2D" text-anchor="middle">只做它：调度再好，每周期也只能落一条</text>

  <!-- 汇合到结果 -->
  <line x1="555" y1="144" x2="650" y2="244" stroke="#185FA5" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="555" y1="404" x2="650" y2="296" stroke="#534AB7" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="655" y="230" width="210" height="84" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.4"/>
  <text x="760" y="262" font-size="14" font-weight="bold" fill="#0F6E56" text-anchor="middle">多发射 + 乱序</text>
  <text x="760" y="288" font-size="12" fill="#0F6E56" text-anchor="middle">CPI 才真正降下来</text>

  <text x="30" y="522" font-size="12" fill="#6B7280">本书先用 2 发射最小核讲透乱序闭环，再讲宽度扩展：宽度是加法，乱序闭环才是要吃透的核心。</text>
</svg>
