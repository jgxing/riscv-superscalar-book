<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="1000" height="450" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <title>图14-1 两种重定向来源</title>
  <desc>重定向有两个来源：分支执行单元发现预测错误，提交口发现异常。两者都带正确 PC、出错序号和检查点号，经仲裁后发往前端和后端。</desc>
  <rect x="0" y="0" width="1000" height="450" fill="#ffffff"/>

  <text x="30" y="38" font-size="18" font-weight="bold" fill="#1f2937">图 14-1　两种重定向来源</text>
  <text x="30" y="62" font-size="12.5" fill="#5F5E5A">一个来自分支执行，一个来自提交口，最后都汇到同一个重定向口</text>

  <!-- 来源一 -->
  <rect x="30" y="90" width="290" height="150" rx="10" fill="#FFF7E8" stroke="#D97706" stroke-width="1.5"/>
  <text x="48" y="118" font-size="13" font-weight="bold" fill="#B45309">来源一　分支执行单元</text>
  <text x="48" y="144" font-size="11.5" fill="#92400E">分支算完发现方向和目标猜错了</text>
  <text x="48" y="168" font-size="11.5" fill="#92400E">带出正确 PC、分支序号、检查点号</text>
  <rect x="48" y="184" width="250" height="40" rx="7" fill="#ffffff" stroke="#D97706"/>
  <text x="173" y="210" font-size="12" fill="#B45309" text-anchor="middle">br_mispred / br_pc / br_seq / br_cp</text>

  <!-- 来源二 -->
  <rect x="30" y="256" width="290" height="150" rx="10" fill="#FDECEC" stroke="#B91C1C" stroke-width="1.5"/>
  <text x="48" y="284" font-size="13" font-weight="bold" fill="#B91C1C">来源二　提交口</text>
  <text x="48" y="310" font-size="11.5" fill="#7F1D1D">队头 uop 带异常，到提交时才暴露</text>
  <text x="48" y="334" font-size="11.5" fill="#7F1D1D">带出处理入口 PC、序号、检查点号</text>
  <rect x="48" y="350" width="250" height="40" rx="7" fill="#ffffff" stroke="#B91C1C"/>
  <text x="173" y="376" font-size="12" fill="#B91C1C" text-anchor="middle">exc / exc_pc / exc_seq / exc_cp</text>

  <!-- 仲裁 -->
  <rect x="370" y="170" width="180" height="110" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.8"/>
  <text x="460" y="204" font-size="13" font-weight="bold" fill="#0C447C" text-anchor="middle">仲裁</text>
  <text x="460" y="228" font-size="11.5" fill="#185FA5" text-anchor="middle">异常优先</text>
  <text x="460" y="252" font-size="11.5" fill="#185FA5" text-anchor="middle">两者同时来时</text>

  <path d="M320 165 L370 200" stroke="#94A3B8" stroke-width="1.6" fill="none"/>
  <path d="M320 331 L370 250" stroke="#94A3B8" stroke-width="1.6" fill="none"/>

  <!-- 三个去向 -->
  <text x="600" y="130" font-size="12.5" font-weight="bold" fill="#374151">仲裁之后分三路发出</text>

  <rect x="600" y="146" width="360" height="66" rx="9" fill="#E6F1FB" stroke="#185FA5"/>
  <text x="616" y="170" font-size="12.5" font-weight="bold" fill="#0C447C">前端重定向</text>
  <text x="616" y="192" font-size="11.5" fill="#374151">front_pc 送进 FTQ，从正确地址重新取指</text>

  <rect x="600" y="222" width="360" height="66" rx="9" fill="#E6F1FB" stroke="#185FA5"/>
  <text x="616" y="246" font-size="12.5" font-weight="bold" fill="#0C447C">后端冲刷</text>
  <text x="616" y="268" font-size="11.5" fill="#374151">kill_from 是阈值，错误路径上的 uop 全作废</text>

  <rect x="600" y="298" width="360" height="66" rx="9" fill="#E6F1FB" stroke="#185FA5"/>
  <text x="616" y="322" font-size="12.5" font-weight="bold" fill="#0C447C">状态恢复</text>
  <text x="616" y="344" font-size="11.5" fill="#374151">按检查点号读回 RAT 和空闲表指针</text>

  <path d="M550 225 L600 179" stroke="#94A3B8" stroke-width="1.6" fill="none"/>
  <path d="M550 225 L600 255" stroke="#94A3B8" stroke-width="1.6" fill="none"/>
  <path d="M550 225 L600 331" stroke="#94A3B8" stroke-width="1.6" fill="none"/>

  <text x="30" y="430" font-size="11.5" fill="#8B5E00">要点　来源不同，处理动作一样：改 PC、冲错误路径、恢复命名状态</text>
</svg>
