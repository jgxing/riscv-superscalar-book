<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" width="980" height="520" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <title>图4-4 前端各级带宽的匹配</title>
  <desc>前端的预测、取指、译码和后端发射各级宽度应大致相等。若发射宽度为4而前端只有2，实际吞吐仍被前端卡在2，多出来的发射槽空转；各级配平到4后吞吐才真正提升。</desc>
  <rect x="0" y="0" width="980" height="520" fill="#ffffff"/>

  <text x="30" y="40" font-size="18" font-weight="bold" fill="#1f2937">图 4-4　前端各级带宽的匹配</text>
  <text x="30" y="64" font-size="12.5" fill="#5F5E5A">木桶能装多少水，取决于最短的那块板</text>

  <!-- 左：不匹配 -->
  <g>
    <rect x="30" y="90" width="450" height="330" rx="12" fill="#FCECEC" stroke="#A32D2D" stroke-width="1.4"/>
    <text x="255" y="122" font-size="15" font-weight="bold" fill="#A32D2D" text-anchor="middle">宽度不匹配　发射宽、前端窄</text>

    <!-- 刻度 -->
    <text x="118" y="152" font-size="10.5" fill="#6B7280" text-anchor="middle">0</text>
    <text x="218" y="152" font-size="10.5" fill="#6B7280" text-anchor="middle">2</text>
    <text x="318" y="152" font-size="10.5" fill="#6B7280" text-anchor="middle">4</text>
    <text x="418" y="152" font-size="10.5" fill="#6B7280" text-anchor="middle">6</text>
    <line x1="118" y1="160" x2="418" y2="160" stroke="#E5E7EB" stroke-width="1"/>

    <!-- 四条 -->
    <text x="50" y="196" font-size="12" fill="#374151">预测</text>
    <rect x="118" y="182" width="100" height="20" rx="4" fill="#FAC775" stroke="#BA7517"/>
    <text x="228" y="197" font-size="11" fill="#854d0e">2</text>

    <text x="50" y="240" font-size="12" fill="#374151">取指</text>
    <rect x="118" y="226" width="100" height="20" rx="4" fill="#FAC775" stroke="#BA7517"/>
    <text x="228" y="241" font-size="11" fill="#854d0e">2</text>

    <text x="50" y="284" font-size="12" fill="#374151">译码</text>
    <rect x="118" y="270" width="100" height="20" rx="4" fill="#FAC775" stroke="#BA7517"/>
    <text x="228" y="285" font-size="11" fill="#854d0e">2</text>

    <text x="50" y="328" font-size="12" fill="#374151">发射</text>
    <rect x="118" y="314" width="200" height="20" rx="4" fill="#E6F1FB" stroke="#185FA5"/>
    <text x="328" y="329" font-size="11" fill="#0C447C">4</text>
    <!-- 空转部分 -->
    <rect x="218" y="314" width="100" height="20" rx="4" fill="none" stroke="#A32D2D" stroke-dasharray="4 3"/>
    <text x="268" y="360" font-size="10.5" fill="#A32D2D" text-anchor="middle">空转的一半</text>

    <text x="50" y="398" font-size="12.5" font-weight="bold" fill="#A32D2D">实际吞吐仍是 2，多买的发射槽闲着</text>
  </g>

  <!-- 右：匹配 -->
  <g>
    <rect x="500" y="90" width="450" height="330" rx="12" fill="#F1F8F4" stroke="#0F6E56" stroke-width="1.4"/>
    <text x="725" y="122" font-size="15" font-weight="bold" fill="#0F6E56" text-anchor="middle">宽度配平　各级一起加宽</text>

    <text x="588" y="152" font-size="10.5" fill="#6B7280" text-anchor="middle">0</text>
    <text x="688" y="152" font-size="10.5" fill="#6B7280" text-anchor="middle">2</text>
    <text x="788" y="152" font-size="10.5" fill="#6B7280" text-anchor="middle">4</text>
    <text x="888" y="152" font-size="10.5" fill="#6B7280" text-anchor="middle">6</text>
    <line x1="588" y1="160" x2="888" y2="160" stroke="#E5E7EB" stroke-width="1"/>

    <text x="520" y="196" font-size="12" fill="#374151">预测</text>
    <rect x="588" y="182" width="200" height="20" rx="4" fill="#B7E4CD" stroke="#0F6E56"/>
    <text x="798" y="197" font-size="11" fill="#0F6E56">4</text>

    <text x="520" y="240" font-size="12" fill="#374151">取指</text>
    <rect x="588" y="226" width="200" height="20" rx="4" fill="#B7E4CD" stroke="#0F6E56"/>
    <text x="798" y="241" font-size="11" fill="#0F6E56">4</text>

    <text x="520" y="284" font-size="12" fill="#374151">译码</text>
    <rect x="588" y="270" width="200" height="20" rx="4" fill="#B7E4CD" stroke="#0F6E56"/>
    <text x="798" y="285" font-size="11" fill="#0F6E56">4</text>

    <text x="520" y="328" font-size="12" fill="#374151">发射</text>
    <rect x="588" y="314" width="200" height="20" rx="4" fill="#B7E4CD" stroke="#0F6E56"/>
    <text x="798" y="329" font-size="11" fill="#0F6E56">4</text>

    <text x="520" y="398" font-size="12.5" font-weight="bold" fill="#0F6E56">吞吐真正到了 4，各级都不拖后腿</text>
  </g>

  <!-- 底部说明 -->
  <rect x="30" y="446" width="920" height="54" rx="10" fill="#FAFAF9" stroke="#D1D5DB" stroke-width="1.2"/>
  <text x="50" y="472" font-size="12.5" fill="#2C2C2A">纸面带宽还要打折：分支密度让前端每隔几十条就得预测一次，猜错更要冲刷重取。</text>
  <text x="50" y="492" font-size="12.5" fill="#2C2C2A">所以峰值带宽再高，实际能用上六七成就不错了。</text>
</svg>
