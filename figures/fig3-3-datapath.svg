<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <title>图3-3 Tomasulo 完整数据通路</title>
  <desc>展示发射、保留站、功能部件、公共数据总线 CDB、重命名表 RAT 与寄存器堆之间的数据流与广播唤醒反馈环路。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="620" fill="#ffffff"/>

  <text x="30" y="38" font-size="18" font-weight="bold" fill="#1f2937">图 3-3　Tomasulo 完整数据通路</text>

  <!-- ① 发射 -->
  <g>
    <rect x="30" y="60" width="190" height="70" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.2"/>
    <text x="125" y="88" font-size="15" font-weight="bold" fill="#0C447C" text-anchor="middle">① 译码 / 发射</text>
    <text x="125" y="112" font-size="12.5" fill="#185FA5" text-anchor="middle">查 RAT + 读寄存器堆</text>
  </g>
  <text x="10" y="103" font-size="12" fill="#5F5E5A">指令</text>
  <line x1="52" y1="100" x2="28" y2="100" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- 发射旁：RAT 与寄存器堆 -->
  <g>
    <rect x="270" y="60" width="160" height="70" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.2"/>
    <text x="350" y="88" font-size="15" font-weight="bold" fill="#3C3489" text-anchor="middle">RAT 重命名表</text>
    <text x="350" y="112" font-size="12.5" fill="#534AB7" text-anchor="middle">R1 → #21（最新标签）</text>
  </g>
  <g>
    <rect x="480" y="60" width="160" height="70" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.2"/>
    <text x="560" y="88" font-size="15" font-weight="bold" fill="#2C2C2A" text-anchor="middle">寄存器堆 PRF</text>
    <text x="560" y="112" font-size="12.5" fill="#5F5E5A" text-anchor="middle">取已就绪的值</text>
  </g>
  <line x1="220" y1="95" x2="268" y2="95" stroke="#534AB7" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="220" y1="110" x2="478" y2="110" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- ② 保留站 -->
  <g>
    <rect x="30" y="165" width="610" height="120" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.2"/>
    <text x="50" y="190" font-size="14" font-weight="bold" fill="#3C3489">② 保留站阵列（操作数没好就在这里等位，不挡流水线）</text>
    <g font-size="12" text-anchor="middle">
      <rect x="48" y="202" width="132" height="66" rx="8" fill="#fff" stroke="#7F77DD"/>
      <text x="114" y="222" font-weight="bold" fill="#3C3489">#21 MUL</text>
      <text x="114" y="242" fill="#534AB7">Vj=✓ Vk=✓</text>
      <text x="114" y="259" fill="#0F6E56">就绪 → 执行</text>

      <rect x="192" y="202" width="132" height="66" rx="8" fill="#fff" stroke="#7F77DD"/>
      <text x="258" y="222" font-weight="bold" fill="#3C3489">#22 ADD</text>
      <text x="258" y="242" fill="#BA7517">Qj=#21 等待</text>
      <text x="258" y="259" fill="#993C1D">Vk=旧R5 ✓</text>

      <rect x="336" y="202" width="132" height="66" rx="8" fill="#fff" stroke="#7F77DD"/>
      <text x="402" y="222" font-weight="bold" fill="#3C3489">#23 SUB</text>
      <text x="402" y="242" fill="#534AB7">Vj=✓ Vk=✓</text>
      <text x="402" y="259" fill="#0F6E56">就绪 → 执行</text>

      <rect x="480" y="202" width="140" height="66" rx="8" fill="#fff" stroke="#7F77DD"/>
      <text x="550" y="222" font-weight="bold" fill="#3C3489">#24 ADD</text>
      <text x="550" y="242" fill="#534AB7">Vj=✓ Vk=✓</text>
      <text x="550" y="259" fill="#0F6E56">就绪 → 执行</text>
    </g>
  </g>
  <!-- 发射 -> 保留站 -->
  <line x1="125" y1="130" x2="125" y2="163" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="135" y="152" font-size="11.5" fill="#534AB7">更新 RAT[dest]=新标签</text>

  <!-- ③ 功能部件 -->
  <g>
    <rect x="60" y="330" width="400" height="86" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.2"/>
    <text x="80" y="354" font-size="14" font-weight="bold" fill="#085041">③ 功能部件（就绪即执行，乱序就发生在这里）</text>
    <g text-anchor="middle" font-size="12.5">
      <rect x="80" y="366" width="110" height="38" rx="8" fill="#fff" stroke="#0F6E56"/>
      <text x="135" y="390" fill="#085041">ALU（1拍）</text>
      <rect x="205" y="366" width="110" height="38" rx="8" fill="#fff" stroke="#0F6E56"/>
      <text x="260" y="390" fill="#085041">MUL（3拍）</text>
      <rect x="330" y="366" width="110" height="38" rx="8" fill="#fff" stroke="#0F6E56"/>
      <text x="385" y="390" fill="#085041">ALU（1拍）</text>
    </g>
  </g>
  <line x1="200" y1="285" x2="200" y2="328" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="212" y="310" font-size="11.5" fill="#0F6E56">Vj,Vk 都有值 → 选中执行</text>

  <!-- ④ CDB -->
  <g>
    <rect x="200" y="452" width="470" height="58" rx="12" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.6"/>
    <text x="435" y="476" font-size="15" font-weight="bold" fill="#633806" text-anchor="middle">④ CDB 公共数据总线（广播）</text>
    <text x="435" y="497" font-size="12.5" fill="#854F0B" text-anchor="middle">(标签 #21, 结果 6)，谁需要谁接</text>
  </g>
  <line x1="260" y1="416" x2="360" y2="450" stroke="#BA7517" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="270" y="440" font-size="11.5" fill="#854F0B">结果+标签</text>

  <!-- ⑤ 监听唤醒 -->
  <g text-anchor="middle">
    <rect x="60" y="545" width="200" height="56" rx="9" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.2"/>
    <text x="160" y="567" font-size="12.5" font-weight="bold" fill="#085041">#22 监听 Qj == #21</text>
    <text x="160" y="587" font-size="11.5" fill="#0F6E56">锁存 Vj、清 Q → 唤醒</text>

    <rect x="330" y="545" width="190" height="56" rx="9" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1.2"/>
    <text x="425" y="567" font-size="12.5" font-weight="bold" fill="#791F1F">RAT[R1] = #24 ≠ #21</text>
    <text x="425" y="587" font-size="11.5" fill="#A32D2D">不匹配 → 不更新（WAW✓）</text>

    <rect x="580" y="545" width="180" height="56" rx="9" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.2"/>
    <text x="670" y="567" font-size="12.5" font-weight="bold" fill="#2C2C2A">其它保留站</text>
    <text x="670" y="587" font-size="11.5" fill="#5F5E5A">Q 不匹配 → 不动</text>
  </g>
  <line x1="300" y1="510" x2="180" y2="543" stroke="#BA7517" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="435" y1="510" x2="425" y2="543" stroke="#BA7517" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="600" y1="510" x2="660" y2="543" stroke="#BA7517" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- 反馈环示意 -->
  <path d="M690 495 C 800 495, 820 340, 660 250 C 640 235, 615 210, 600 200" fill="none" stroke="#BA7517" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="716" y="380" font-size="12" fill="#854F0B" transform="rotate(-90 716 380)">反馈环：CDB 回连每个保留站与 RAT</text>

  <line x1="30" y1="605" x2="870" y2="605" stroke="#E5E7EB" stroke-width="1"/>
  <text x="30" y="590" font-size="12" fill="#6B7280">三个核心机制 = 保留站（等位） + 重命名（换标签） + 广播（主动唤醒）　｜　RAW 靠等标签保持，WAR/WAW 因标签不同而消除</text>
</svg>
