<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <title>图3-1 寄存器重命名化解 WAW 与 WAR</title>
  <desc>用取餐口叫号的比喻展示 RAT 表在两次写 R1 时的标签覆盖过程，以及 WAR 伪相关如何因旧值已复制而被消除。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="400" fill="#ffffff"/>
  <text x="30" y="36" font-size="18" font-weight="bold" fill="#1f2937">图 3-1　用标签代替名字化解 WAW 与 WAR</text>

  <!-- 表头 -->
  <text x="60" y="80" font-size="14" font-weight="bold" fill="#3C3489">RAT 表（取餐口 → 当前叫号牌）</text>
  <g font-size="13" text-anchor="middle">
    <rect x="60" y="92" width="110" height="34" fill="#EEEDFE" stroke="#534AB7"/>
    <text x="115" y="114" font-weight="bold" fill="#3C3489">架构寄存器</text>
    <rect x="170" y="92" width="150" height="34" fill="#EEEDFE" stroke="#534AB7"/>
    <text x="245" y="114" font-weight="bold" fill="#3C3489">RAT 登记（最新标签）</text>
    <rect x="320" y="92" width="180" height="34" fill="#EEEDFE" stroke="#534AB7"/>
    <text x="410" y="114" font-weight="bold" fill="#3C3489">含义</text>
  </g>

  <!-- 初始 -->
  <g font-size="13" text-anchor="middle">
    <rect x="60" y="126" width="110" height="40" fill="#fff" stroke="#B4B2A9"/>
    <text x="115" y="151" fill="#2C2C2A">初始 R1</text>
    <rect x="170" y="126" width="150" height="40" fill="#fff" stroke="#B4B2A9"/>
    <text x="245" y="151" fill="#5F5E5A">空（无在途写）</text>
    <rect x="320" y="126" width="180" height="40" fill="#fff" stroke="#B4B2A9"/>
    <text x="410" y="151" fill="#5F5E5A">寄存器堆里就是有效值</text>
  </g>
  <!-- 发射 I1 -->
  <g font-size="13" text-anchor="middle">
    <rect x="60" y="170" width="110" height="44" fill="#E6F1FB" stroke="#185FA5"/>
    <text x="115" y="197" fill="#0C447C">发射 I1 写 R1</text>
    <rect x="170" y="170" width="150" height="44" fill="#E6F1FB" stroke="#185FA5"/>
    <text x="245" y="197" font-weight="bold" fill="#0C447C">R1 → #21</text>
    <rect x="320" y="170" width="180" height="44" fill="#E6F1FB" stroke="#185FA5"/>
    <text x="410" y="197" fill="#185FA5">最新值将由标签 #21 产生</text>
  </g>
  <!-- 发射 I4 覆盖 -->
  <g font-size="13" text-anchor="middle">
    <rect x="60" y="218" width="110" height="44" fill="#FAEEDA" stroke="#BA7517"/>
    <text x="115" y="245" fill="#633806">发射 I4 写 R1</text>
    <rect x="170" y="218" width="150" height="44" fill="#FAEEDA" stroke="#BA7517"/>
    <text x="245" y="245" font-weight="bold" fill="#633806">R1 → #24（覆盖）</text>
    <rect x="320" y="218" width="180" height="44" fill="#FAEEDA" stroke="#BA7517"/>
    <text x="410" y="245" fill="#854F0B">登记簿改写，#21 作废</text>
  </g>

  <!-- 右侧：两个化解结论 -->
  <g>
    <rect x="540" y="92" width="330" height="80" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.2"/>
    <text x="558" y="118" font-size="14" font-weight="bold" fill="#085041">WAW 化解</text>
    <text x="558" y="141" font-size="12.5" fill="#0F6E56">I1(#21) 与 I4(#24) 写同一 R1，标签不同。</text>
    <text x="558" y="161" font-size="12.5" fill="#0F6E56">谁先算完都行，最终登记的是 #24 ✓</text>
  </g>
  <g>
    <rect x="540" y="182" width="330" height="80" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.2"/>
    <text x="558" y="208" font-size="14" font-weight="bold" fill="#3C3489">WAR 化解</text>
    <text x="558" y="231" font-size="12.5" fill="#534AB7">I2 发射时把旧 R5 值 copy 进 Vk；</text>
    <text x="558" y="251" font-size="12.5" fill="#534AB7">之后 I5 写 R5，已与 I2 手中的旧值无关 ✓</text>
  </g>

  <!-- 广播对照 -->
  <g font-size="13">
    <line x1="245" y1="262" x2="245" y2="292" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#arrow)"/>
    <rect x="60" y="294" width="440" height="60" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.2"/>
    <text x="80" y="319" font-size="13" font-weight="bold" fill="#2C2C2A">随后 #21 结果广播：</text>
    <text x="80" y="341" fill="#5F5E5A">RAT[R1] 现在是 #24 ≠ #21 → 不更新，正确保留 I4 的结果</text>
  </g>

  <rect x="30" y="368" width="840" height="24" rx="6" fill="#EEEDFE"/>
  <text x="45" y="384" font-size="12.5" fill="#3C3489">一句话概括：把寄存器名字换成数据标签。RAW 靠等标签保持，WAR/WAW 因标签不同而消失。</text>
</svg>
