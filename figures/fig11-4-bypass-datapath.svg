<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <title>图11-4 一个执行口里的旁路选择</title>
  <desc>源物理号同旁路结果的目的号做内容比较，命中就选旁路值，未命中用寄存器堆读值，选好的两个操作数送进ALU，结果连同目的号广播。</desc>
  <rect x="0" y="0" width="1000" height="520" fill="#ffffff"/>

  <text x="30" y="38" font-size="18" font-weight="bold" fill="#1f2937">图 11-4　一个执行口里的旁路选择</text>
  <text x="30" y="62" font-size="12.5" fill="#5F5E5A">源物理号与结果目的号比较，命中就改用旁路值</text>

  <text x="30" y="92" font-size="12" font-weight="bold" fill="#0C447C">取数来源</text>
  <text x="330" y="92" font-size="12" font-weight="bold" fill="#0C447C">旁路选择</text>
  <text x="650" y="92" font-size="12" font-weight="bold" fill="#0C447C">运算与广播</text>

  <!-- 三个来源 -->
  <rect x="30" y="104" width="230" height="66" rx="8" fill="#F7F9FC" stroke="#94A3B8"/>
  <text x="46" y="130" font-size="12.5" font-weight="bold" fill="#475569">寄存器堆读源操作数</text>
  <text x="46" y="153" font-size="11.5" fill="#64748B">ps1=P10 读到 0x11（旧）</text>

  <rect x="30" y="194" width="230" height="60" rx="8" fill="#FFF7E8" stroke="#D97706"/>
  <text x="46" y="219" font-size="12.5" font-weight="bold" fill="#92400E">旁路第 0 路结果</text>
  <text x="46" y="241" font-size="11.5" fill="#B45309">P10 → 0x2a</text>

  <rect x="30" y="284" width="230" height="60" rx="8" fill="#FFF7E8" stroke="#D97706"/>
  <text x="46" y="309" font-size="12.5" font-weight="bold" fill="#92400E">旁路第 1 路结果</text>
  <text x="46" y="331" font-size="11.5" fill="#B45309">P2 → 0x08</text>

  <!-- 两个选择器 -->
  <rect x="330" y="130" width="250" height="86" rx="9" fill="#E7F5EC" stroke="#2E8B57" stroke-width="1.6"/>
  <text x="348" y="157" font-size="12.5" font-weight="bold" fill="#1E6B40">源 1 选择　ps1=P10</text>
  <text x="348" y="180" font-size="11.5" fill="#1E6B40">命中第 0 路，不取寄存器旧值</text>
  <text x="348" y="204" font-size="13" font-weight="bold" fill="#1E6B40">src1 = 0x2a</text>

  <rect x="330" y="260" width="250" height="86" rx="9" fill="#E7F5EC" stroke="#2E8B57" stroke-width="1.6"/>
  <text x="348" y="287" font-size="12.5" font-weight="bold" fill="#1E6B40">源 2 选择　ps2=P2</text>
  <text x="348" y="310" font-size="11.5" fill="#1E6B40">命中第 1 路</text>
  <text x="348" y="334" font-size="13" font-weight="bold" fill="#1E6B40">src2 = 0x08</text>

  <!-- ALU 与结果 -->
  <rect x="650" y="195" width="150" height="100" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.8"/>
  <text x="725" y="228" font-size="15" font-weight="bold" fill="#0C447C" text-anchor="middle">ALU</text>
  <text x="725" y="256" font-size="12" fill="#374151" text-anchor="middle">0x2a + 0x08</text>
  <text x="725" y="280" font-size="14" font-weight="bold" fill="#185FA5" text-anchor="middle">= 0x32</text>

  <rect x="840" y="210" width="140" height="70" rx="9" fill="#FFF7E8" stroke="#D97706" stroke-width="1.6"/>
  <text x="910" y="239" font-size="12.5" font-weight="bold" fill="#92400E" text-anchor="middle">结果 P12</text>
  <text x="910" y="261" font-size="11.5" fill="#B45309" text-anchor="middle">挂上旁路网</text>

  <!-- 连线 -->
  <line x1="260" y1="137" x2="328" y2="160" stroke="#64748B" stroke-width="1.6"/>
  <polygon points="328,160 320,157 323,165" fill="#64748B"/>
  <line x1="260" y1="224" x2="328" y2="186" stroke="#D97706" stroke-width="1.6"/>
  <polygon points="328,186 320,187 324,179" fill="#D97706"/>
  <line x1="260" y1="314" x2="328" y2="300" stroke="#D97706" stroke-width="1.6"/>
  <polygon points="328,300 320,296 323,304" fill="#D97706"/>
  <line x1="580" y1="173" x2="648" y2="225" stroke="#2E8B57" stroke-width="1.8"/>
  <polygon points="648,225 639,223 644,216" fill="#2E8B57"/>
  <line x1="580" y1="303" x2="648" y2="265" stroke="#2E8B57" stroke-width="1.8"/>
  <polygon points="648,265 639,266 644,273" fill="#2E8B57"/>
  <line x1="800" y1="245" x2="838" y2="245" stroke="#D97706" stroke-width="1.8"/>
  <polygon points="838,245 830,241 830,249" fill="#D97706"/>

  <!-- 未命中的说明 -->
  <rect x="30" y="384" width="950" height="46" rx="8" fill="#F7F9FC" stroke="#CBD5E1"/>
  <text x="46" y="405" font-size="12" fill="#374151">如果源号换成 P11，两路结果的目的号都对不上，src1 就取寄存器堆的旧值 0x11。</text>
  <text x="46" y="423" font-size="11.5" fill="#64748B">命中与否既要看物理号相等，也要看这一路结果是否已经有效。</text>

  <rect x="30" y="446" width="950" height="50" rx="8" fill="#FFF7E8" stroke="#D97706"/>
  <text x="46" y="468" font-size="12" fill="#92400E">要点　比较用的是物理号，不是逻辑号。内容比较选数据，和发射队列用内容比较置就绪是同一招。</text>
  <text x="46" y="487" font-size="11.5" fill="#B45309">两路结果目的号撞车时，取更晚产生的那一路。</text>
</svg>
