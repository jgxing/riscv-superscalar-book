<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" width="980" height="520" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <title>图5-1 流水线越深，一次预测错误的代价越大</title>
  <desc>对比五级流水线与深流水线：分支结果出来前，五级流水线只取了几条指令，深流水线已取了几十条，预测错误时要冲掉重来的指令数与流水线深度成正比。</desc>
  <rect x="0" y="0" width="980" height="520" fill="#ffffff"/>

  <text x="30" y="40" font-size="18" font-weight="bold" fill="#1f2937">图 5-1　流水线越深，一次预测错误的代价越大</text>
  <text x="30" y="64" font-size="12.5" fill="#5F5E5A">从取指到分支结果出来的这段空档里，前端一直在取指，深流水线浪费得多得多</text>

  <!-- 左：五级流水线 -->
  <g>
    <rect x="30" y="92" width="440" height="330" rx="12" fill="#F2F8F1" stroke="#6E9B62" stroke-width="1.4"/>
    <text x="250" y="124" font-size="15" font-weight="bold" fill="#3E6B34" text-anchor="middle">五级流水线</text>
    <text x="250" y="146" font-size="11.5" fill="#5F5E5A" text-anchor="middle">分支结果在 EX 阶段出来，只过了几拍</text>

    <!-- 时间轴 -->
    <line x1="62" y1="200" x2="438" y2="200" stroke="#9CA3AF" stroke-width="1.4"/>
    <polygon points="438,200 430,196 430,204" fill="#9CA3AF"/>
    <text x="62" y="192" font-size="10.5" fill="#6B7280">取指时刻</text>
    <text x="430" y="192" font-size="10.5" fill="#6B7280" text-anchor="end">分支结果出来</text>

    <!-- 取指的指令格 -->
    <text x="62" y="238" font-size="11" fill="#374151">已取指令</text>
    <g>
      <rect x="150" y="222" width="52" height="30" rx="5" fill="#D9EAD6" stroke="#6E9B62"/>
      <text x="176" y="242" font-size="11" fill="#3E6B34" text-anchor="middle">I1</text>
      <rect x="208" y="222" width="52" height="30" rx="5" fill="#D9EAD6" stroke="#6E9B62"/>
      <text x="234" y="242" font-size="11" fill="#3E6B34" text-anchor="middle">I2</text>
      <rect x="266" y="222" width="52" height="30" rx="5" fill="#FCECEC" stroke="#A32D2D"/>
      <text x="292" y="242" font-size="11" fill="#A32D2D" text-anchor="middle">I3</text>
      <rect x="324" y="222" width="52" height="30" rx="5" fill="#FCECEC" stroke="#A32D2D"/>
      <text x="350" y="242" font-size="11" fill="#A32D2D" text-anchor="middle">I4</text>
    </g>
    <text x="250" y="290" font-size="12" fill="#7a2020" text-anchor="middle">预测错 → 冲掉约 4 条</text>

    <rect x="90" y="330" width="320" height="60" rx="8" fill="#fff" stroke="#6E9B62" stroke-width="1.2"/>
    <text x="250" y="356" font-size="12" fill="#374151" text-anchor="middle">浪费小，靠冲刷几条指令就能补回来</text>
    <text x="250" y="376" font-size="11" fill="#6B7280" text-anchor="middle">代价约几条指令</text>
  </g>

  <!-- 右：深流水线 -->
  <g>
    <rect x="510" y="92" width="440" height="330" rx="12" fill="#FCF0EC" stroke="#C4613C" stroke-width="1.4"/>
    <text x="730" y="124" font-size="15" font-weight="bold" fill="#9C4526" text-anchor="middle">十几级深流水线</text>
    <text x="730" y="146" font-size="11.5" fill="#5F5E5A" text-anchor="middle">分支结果十几拍后才出来，前端一直没停</text>

    <line x1="542" y1="200" x2="918" y2="200" stroke="#9CA3AF" stroke-width="1.4"/>
    <polygon points="918,200 910,196 910,204" fill="#9CA3AF"/>
    <text x="542" y="192" font-size="10.5" fill="#6B7280">取指时刻</text>
    <text x="910" y="192" font-size="10.5" fill="#6B7280" text-anchor="end">分支结果出来</text>

    <text x="542" y="238" font-size="11" fill="#374151">已取指令</text>
    <g>
      <rect x="600" y="222" width="34" height="30" rx="4" fill="#D9EAD6" stroke="#6E9B62"/>
      <rect x="638" y="222" width="34" height="30" rx="4" fill="#D9EAD6" stroke="#6E9B62"/>
      <rect x="676" y="222" width="34" height="30" rx="4" fill="#FCE0D5" stroke="#C4613C"/>
      <rect x="714" y="222" width="34" height="30" rx="4" fill="#FCE0D5" stroke="#C4613C"/>
      <rect x="752" y="222" width="34" height="30" rx="4" fill="#FCE0D5" stroke="#C4613C"/>
      <rect x="790" y="222" width="34" height="30" rx="4" fill="#FCE0D5" stroke="#C4613C"/>
      <rect x="828" y="222" width="34" height="30" rx="4" fill="#FCE0D5" stroke="#C4613C"/>
      <rect x="866" y="222" width="34" height="30" rx="4" fill="#FCE0D5" stroke="#C4613C"/>
      <text x="784" y="242" font-size="10.5" fill="#9C4526" text-anchor="middle">……</text>
    </g>
    <text x="730" y="290" font-size="12" fill="#9C4526" text-anchor="middle">预测错 → 冲掉几十条，部分可能已执行</text>

    <rect x="570" y="330" width="320" height="60" rx="8" fill="#fff" stroke="#C4613C" stroke-width="1.2"/>
    <text x="730" y="356" font-size="12" fill="#374151" text-anchor="middle">浪费大，还要恢复重命名表等状态</text>
    <text x="730" y="376" font-size="11" fill="#6B7280" text-anchor="middle">代价约几十拍 + 恢复工作</text>
  </g>

  <!-- 底部结论 -->
  <rect x="30" y="446" width="920" height="52" rx="10" fill="#F4F4F2" stroke="#D6D6D2"/>
  <text x="490" y="470" font-size="13" font-weight="bold" fill="#1f2937" text-anchor="middle">分支开销 ≈ 分支频率 × 预测错误率 × 冲刷深度</text>
  <text x="490" y="489" font-size="11.5" fill="#5F5E5A" text-anchor="middle">冲刷深度随流水线加深只增不减，唯一能主动压低的就是预测错误率</text>
</svg>
