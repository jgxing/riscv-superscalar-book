<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" width="980" height="520" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <title>图5-3 循环分支的预测与修正过程</title>
  <desc>一个执行10次的循环，前9次跳第10次不跳。2位计数器很快爬到强跳11，前9次预测全对；第10次实际不跳，状态降到10仍猜跳，错一次；下一轮进入时升回11。每轮只错一次。</desc>
  <rect x="0" y="0" width="980" height="520" fill="#ffffff"/>

  <text x="30" y="40" font-size="18" font-weight="bold" fill="#1f2937">图 5-3　循环分支的预测与修正过程</text>
  <text x="30" y="64" font-size="12.5" fill="#5F5E5A">循环体执行 10 次：前 9 次跳，第 10 次退出。观察 2 位计数器怎么学</text>

  <!-- 表头 -->
  <g>
    <rect x="40" y="96" width="900" height="40" rx="6" fill="#EDEDED" stroke="#C9C9C5"/>
    <text x="90" y="123" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">循环次数</text>
    <text x="230" y="123" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">实际结果</text>
    <text x="390" y="123" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">预测前状态</text>
    <text x="560" y="123" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">预测</text>
    <text x="700" y="123" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">预测后状态</text>
    <text x="860" y="123" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">对错</text>
  </g>

  <!-- 数据行：用 Python 思路手工列出 1..11 次的关键行 -->
  <!-- 行高 30, 起始 y=136 -->
  <g font-size="11.5">
    <!-- 第1次: 初态01, 实际跳, 预测不跳(错), ->10 -->
    <rect x="40" y="136" width="900" height="30" fill="#FFFFFF"/>
    <text x="90" y="156" fill="#374151" text-anchor="middle">第 1 次</text>
    <text x="230" y="156" fill="#6E9B62" text-anchor="middle">跳</text>
    <text x="390" y="156" fill="#374151" text-anchor="middle">01 弱不跳</text>
    <text x="560" y="156" fill="#374151" text-anchor="middle">不跳</text>
    <text x="700" y="156" fill="#374151" text-anchor="middle">10 弱跳</text>
    <rect x="820" y="141" width="80" height="20" rx="4" fill="#FCECEC" stroke="#A32D2D"/>
    <text x="860" y="156" fill="#A32D2D" text-anchor="middle" font-weight="bold">错</text>

    <!-- 第2次: 10, 跳, 预测跳(对), ->11 -->
    <rect x="40" y="166" width="900" height="30" fill="#F7F7F5"/>
    <text x="90" y="186" fill="#374151" text-anchor="middle">第 2 次</text>
    <text x="230" y="186" fill="#6E9B62" text-anchor="middle">跳</text>
    <text x="390" y="186" fill="#374151" text-anchor="middle">10 弱跳</text>
    <text x="560" y="186" fill="#374151" text-anchor="middle">跳</text>
    <text x="700" y="186" fill="#374151" text-anchor="middle">11 强跳</text>
    <rect x="820" y="171" width="80" height="20" rx="4" fill="#EAF2E7" stroke="#6E9B62"/>
    <text x="860" y="186" fill="#3E6B34" text-anchor="middle" font-weight="bold">对</text>

    <!-- 第3~9次 合并行 -->
    <rect x="40" y="196" width="900" height="30" fill="#FFFFFF"/>
    <text x="90" y="216" fill="#374151" text-anchor="middle">第 3～9 次</text>
    <text x="230" y="216" fill="#6E9B62" text-anchor="middle">跳</text>
    <text x="390" y="216" fill="#374151" text-anchor="middle">11 强跳</text>
    <text x="560" y="216" fill="#374151" text-anchor="middle">跳</text>
    <text x="700" y="216" fill="#374151" text-anchor="middle">11 强跳（饱和）</text>
    <rect x="820" y="201" width="80" height="20" rx="4" fill="#EAF2E7" stroke="#6E9B62"/>
    <text x="860" y="216" fill="#3E6B34" text-anchor="middle" font-weight="bold">全对 ×7</text>

    <!-- 第10次: 11, 实际不跳, 预测跳(错), ->10 -->
    <rect x="40" y="226" width="900" height="30" fill="#FCEFEA"/>
    <text x="90" y="246" fill="#9C4526" text-anchor="middle" font-weight="bold">第 10 次</text>
    <text x="230" y="246" fill="#C4613C" text-anchor="middle" font-weight="bold">不跳（退出）</text>
    <text x="390" y="246" fill="#374151" text-anchor="middle">11 强跳</text>
    <text x="560" y="246" fill="#374151" text-anchor="middle">跳</text>
    <text x="700" y="246" fill="#374151" text-anchor="middle">10 弱跳</text>
    <rect x="820" y="231" width="80" height="20" rx="4" fill="#FCECEC" stroke="#A32D2D"/>
    <text x="860" y="246" fill="#A32D2D" text-anchor="middle" font-weight="bold">错</text>

    <!-- 下一轮第1次: 10, 跳, 预测跳(对), ->11 -->
    <rect x="40" y="256" width="900" height="30" fill="#FFFFFF"/>
    <text x="90" y="276" fill="#374151" text-anchor="middle">下一轮第 1 次</text>
    <text x="230" y="276" fill="#6E9B62" text-anchor="middle">跳</text>
    <text x="390" y="276" fill="#374151" text-anchor="middle">10 弱跳</text>
    <text x="560" y="276" fill="#374151" text-anchor="middle">跳</text>
    <text x="700" y="276" fill="#374151" text-anchor="middle">11 强跳</text>
    <rect x="820" y="261" width="80" height="20" rx="4" fill="#EAF2E7" stroke="#6E9B62"/>
    <text x="860" y="276" fill="#3E6B34" text-anchor="middle" font-weight="bold">对</text>
  </g>

  <!-- 表框 -->
  <rect x="40" y="96" width="900" height="190" rx="6" fill="none" stroke="#C9C9C5"/>

  <!-- 对比结论 -->
  <g>
    <rect x="40" y="312" width="430" height="120" rx="10" fill="#FCEFEA" stroke="#C4613C" stroke-width="1.3"/>
    <text x="255" y="342" font-size="14" font-weight="bold" fill="#9C4526" text-anchor="middle">1 位预测器</text>
    <text x="255" y="370" font-size="12.5" fill="#374151" text-anchor="middle">退出时错一次，状态翻成"不跳"</text>
    <text x="255" y="392" font-size="12.5" fill="#374151" text-anchor="middle">重新进入时又错一次</text>
    <text x="255" y="416" font-size="13" font-weight="bold" fill="#A32D2D" text-anchor="middle">每轮错 2 次</text>

    <rect x="510" y="312" width="430" height="120" rx="10" fill="#F2F8F1" stroke="#6E9B62" stroke-width="1.3"/>
    <text x="725" y="342" font-size="14" font-weight="bold" fill="#3E6B34" text-anchor="middle">2 位预测器</text>
    <text x="725" y="370" font-size="12.5" fill="#374151" text-anchor="middle">退出时 11→10，仍猜跳，错一次</text>
    <text x="725" y="392" font-size="12.5" fill="#374151" text-anchor="middle">重新进入 10→11，猜对</text>
    <text x="725" y="416" font-size="13" font-weight="bold" fill="#3E6B34" text-anchor="middle">每轮只错 1 次</text>
  </g>

  <text x="490" y="470" font-size="12" fill="#5F5E5A" text-anchor="middle">红色格是预测错误。计数器用一次缓冲（01→10→11）消化了循环的偶发例外。</text>
  <text x="490" y="494" font-size="12" fill="#5F5E5A" text-anchor="middle">真正复杂模式的分支要靠更长历史，见 5.5 和 5.8 节。</text>
</svg>
