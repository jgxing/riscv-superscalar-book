<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <title>图A-1 Digital 建模的四个层次</title>
  <desc>从最底层的门电路，到带存储的状态电路，到总线与存储建模，最后封装成子电路，逐层搭出可见的系统连接图。</desc>
  <rect x="0" y="0" width="1000" height="430" fill="#ffffff"/>

  <text x="30" y="38" font-size="18" font-weight="bold" fill="#1f2937">图 A-1　Digital 建模的四个层次</text>
  <text x="30" y="62" font-size="12.5" fill="#5F5E5A">从一根线到一个核，每一层都可以单独仿真</text>

  <!-- 四层卡片 -->
  <g font-size="12.5" text-anchor="middle">
    <rect x="30" y="96" width="212" height="250" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.6"/>
    <text x="136" y="126" font-size="14" font-weight="bold" fill="#0C447C">门电路</text>
    <text x="136" y="152" font-size="11" fill="#475569">And Or Not Mux</text>
    <line x1="55" y1="166" x2="217" y2="166" stroke="#93C5FD"/>
    <text x="136" y="192" font-size="11.5" fill="#334155">组合逻辑</text>
    <text x="136" y="214" font-size="11.5" fill="#334155">输出只看输入</text>
    <text x="136" y="244" font-size="11.5" fill="#334155">例：标签相等检测</text>
    <text x="136" y="264" font-size="11.5" fill="#334155">例：优先仲裁</text>
    <text x="136" y="300" font-size="10.5" fill="#64748B">本书第 3、8、10、</text>
    <text x="136" y="318" font-size="10.5" fill="#64748B">12、13、14、15 章</text>

    <rect x="268" y="96" width="212" height="250" rx="10" fill="#F3E8FF" stroke="#7C3AED" stroke-width="1.6"/>
    <text x="374" y="126" font-size="14" font-weight="bold" fill="#6D28D9">状态电路</text>
    <text x="374" y="152" font-size="11" fill="#475569">触发器 寄存器</text>
    <line x1="293" y1="166" x2="455" y2="166" stroke="#C4B5FD"/>
    <text x="374" y="192" font-size="11.5" fill="#334155">时序逻辑</text>
    <text x="374" y="214" font-size="11.5" fill="#334155">输出还看历史</text>
    <text x="374" y="244" font-size="11.5" fill="#334155">例：带写使能的</text>
    <text x="374" y="264" font-size="11.5" fill="#334155">RAT 表项</text>
    <text x="374" y="300" font-size="10.5" fill="#64748B">本书第 9 章</text>

    <rect x="506" y="96" width="212" height="250" rx="10" fill="#FFF7E8" stroke="#D97706" stroke-width="1.6"/>
    <text x="612" y="126" font-size="14" font-weight="bold" fill="#B45309">总线与存储</text>
    <text x="612" y="152" font-size="11" fill="#475569">Splitter  RAM</text>
    <line x1="531" y1="166" x2="693" y2="166" stroke="#FCD34D"/>
    <text x="612" y="192" font-size="11.5" fill="#334155">多位信号合与拆</text>
    <text x="612" y="214" font-size="11.5" fill="#334155">存储阵列读写</text>
    <text x="612" y="244" font-size="11.5" fill="#334155">例：6 位物理寄存器号</text>
    <text x="612" y="264" font-size="11.5" fill="#334155">在总线上传递</text>
    <text x="612" y="300" font-size="10.5" fill="#64748B">全书各章图</text>

    <rect x="744" y="96" width="226" height="250" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.6"/>
    <text x="857" y="126" font-size="14" font-weight="bold" fill="#15803D">子电路</text>
    <text x="857" y="152" font-size="11" fill="#475569">把上面三层封装起来</text>
    <line x1="769" y1="166" x2="945" y2="166" stroke="#86EFAC"/>
    <text x="857" y="192" font-size="11.5" fill="#334155">给一个模块画好输入</text>
    <text x="857" y="214" font-size="11.5" fill="#334155">输出，起个名字</text>
    <text x="857" y="244" font-size="11.5" fill="#334155">上层图里当成一个</text>
    <text x="857" y="264" font-size="11.5" fill="#334155">方块来用</text>
    <text x="857" y="300" font-size="10.5" fill="#64748B">搭大模型的关键</text>
  </g>

  <!-- 层间箭头 -->
  <g stroke="#94A3B8" stroke-width="2" fill="none">
    <path d="M242 220 L264 220"/>
    <path d="M480 220 L502 220"/>
    <path d="M718 220 L740 220"/>
  </g>
  <g stroke="#94A3B8" stroke-width="2" fill="none">
    <path d="M256 214 L264 220 L256 226"/>
    <path d="M494 214 L502 220 L494 226"/>
    <path d="M732 214 L740 220 L732 226"/>
  </g>

  <text x="30" y="386" font-size="11.5" fill="#374151">建议顺序　先搭门电路跑通真值表，再引入触发器看波形，学会拆合总线后就可以用子电路拼系统。</text>
  <text x="30" y="410" font-size="11.5" fill="#8B5E00">要点　每一层都能单步仿真，看不清就把模块拆小</text>
</svg>
