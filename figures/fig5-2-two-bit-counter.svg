<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <title>图5-2 2位饱和计数器的四个状态与转换</title>
  <desc>四个状态从强不跳(00)、弱不跳(01)、弱跳(10)到强跳(11)。实际跳转沿taken方向加一，实际不跳沿not taken方向减一，到两端饱和不再变化。预测看最高位。</desc>
  <rect x="0" y="0" width="980" height="560" fill="#ffffff"/>

  <text x="30" y="40" font-size="18" font-weight="bold" fill="#1f2937">图 5-2　2 位饱和计数器的四个状态与转换</text>
  <text x="30" y="64" font-size="12.5" fill="#5F5E5A">实际跳就往"跳"挪一格，不跳就往"不跳"挪一格，到头停住；预测看最高位</text>

  <!-- 四个状态排成一行，从左到右 -->
  <!-- 状态1 强不跳 00 -->
  <g>
    <rect x="70" y="150" width="170" height="110" rx="12" fill="#EAF2E7" stroke="#6E9B62" stroke-width="2"/>
    <text x="155" y="186" font-size="15" font-weight="bold" fill="#3E6B34" text-anchor="middle">强不跳</text>
    <text x="155" y="216" font-size="24" font-weight="bold" fill="#2f5230" text-anchor="middle">00</text>
    <text x="155" y="242" font-size="11.5" fill="#6B7280" text-anchor="middle">预测：不跳</text>
  </g>
  <!-- 状态2 弱不跳 01 -->
  <g>
    <rect x="305" y="150" width="170" height="110" rx="12" fill="#F4F8F2" stroke="#9BBE8F" stroke-width="2"/>
    <text x="390" y="186" font-size="15" font-weight="bold" fill="#3E6B34" text-anchor="middle">弱不跳</text>
    <text x="390" y="216" font-size="24" font-weight="bold" fill="#2f5230" text-anchor="middle">01</text>
    <text x="390" y="242" font-size="11.5" fill="#6B7280" text-anchor="middle">预测：不跳</text>
  </g>
  <!-- 状态3 弱跳 10 -->
  <g>
    <rect x="540" y="150" width="170" height="110" rx="12" fill="#FCF0E6" stroke="#D89B72" stroke-width="2"/>
    <text x="625" y="186" font-size="15" font-weight="bold" fill="#9C4526" text-anchor="middle">弱跳</text>
    <text x="625" y="216" font-size="24" font-weight="bold" fill="#7a3418" text-anchor="middle">10</text>
    <text x="625" y="242" font-size="11.5" fill="#6B7280" text-anchor="middle">预测：跳</text>
  </g>
  <!-- 状态4 强跳 11 -->
  <g>
    <rect x="775" y="150" width="170" height="110" rx="12" fill="#F9E4D9" stroke="#C4613C" stroke-width="2"/>
    <text x="860" y="186" font-size="15" font-weight="bold" fill="#9C4526" text-anchor="middle">强跳</text>
    <text x="860" y="216" font-size="24" font-weight="bold" fill="#7a3418" text-anchor="middle">11</text>
    <text x="860" y="242" font-size="11.5" fill="#6B7280" text-anchor="middle">预测：跳</text>
  </g>

  <!-- taken 方向箭头（向右，绿色系） -->
  <line x1="240" y1="205" x2="303" y2="205" stroke="#6E9B62" stroke-width="2.2"/>
  <polygon points="303,205 295,200 295,210" fill="#6E9B62"/>
  <line x1="475" y1="205" x2="538" y2="205" stroke="#6E9B62" stroke-width="2.2"/>
  <polygon points="538,205 530,200 530,210" fill="#6E9B62"/>
  <line x1="710" y1="205" x2="773" y2="205" stroke="#6E9B62" stroke-width="2.2"/>
  <polygon points="773,205 765,200 765,210" fill="#6E9B62"/>
  <text x="490" y="130" font-size="13" font-weight="bold" fill="#3E6B34" text-anchor="middle">实际跳 taken　→　加一</text>

  <!-- not taken 方向箭头（向左，红棕系），画在下方 -->
  <line x1="303" y1="268" x2="240" y2="268" stroke="#C4613C" stroke-width="2.2"/>
  <polygon points="240,268 248,263 248,273" fill="#C4613C"/>
  <line x1="538" y1="268" x2="475" y2="268" stroke="#C4613C" stroke-width="2.2"/>
  <polygon points="475,268 483,263 483,273" fill="#C4613C"/>
  <line x1="773" y1="268" x2="710" y2="268" stroke="#C4613C" stroke-width="2.2"/>
  <polygon points="710,268 718,263 718,273" fill="#C4613C"/>
  <text x="490" y="300" font-size="13" font-weight="bold" fill="#9C4526" text-anchor="middle">实际不跳 not taken　→　减一</text>

  <!-- 饱和自环：强不跳在 not taken 时停住 -->
  <path d="M 70 200 C 30 190, 30 250, 70 240" fill="none" stroke="#6E9B62" stroke-width="1.8"/>
  <polygon points="70,240 78,236 74,228" fill="#6E9B62"/>
  <text x="30" y="290" font-size="10.5" fill="#3E6B34">已在 00</text>
  <text x="30" y="304" font-size="10.5" fill="#3E6B34">再减也不动</text>

  <!-- 饱和自环：强跳在 taken 时停住 -->
  <path d="M 945 200 C 985 190, 985 250, 945 240" fill="none" stroke="#C4613C" stroke-width="1.8"/>
  <polygon points="945,240 937,236 941,228" fill="#C4613C"/>
  <text x="950" y="290" font-size="10.5" fill="#9C4526" text-anchor="end">已在 11</text>
  <text x="950" y="304" font-size="10.5" fill="#9C4526" text-anchor="end">再加也不动</text>

  <!-- 底部说明 -->
  <rect x="70" y="360" width="840" height="150" rx="10" fill="#F7F7F5" stroke="#D6D6D2"/>
  <text x="100" y="390" font-size="13.5" font-weight="bold" fill="#1f2937">为什么比 1 位好</text>
  <text x="100" y="418" font-size="12.5" fill="#374151">1 位预测器遇到一次不跳就立刻翻脸，循环每轮要错两次（退出时、重新进入时）。</text>
  <text x="100" y="444" font-size="12.5" fill="#374151">2 位计数器要连续两次相反结果才改口：循环退出时 11 → 10 仍猜跳，下次进入 10 → 11，</text>
  <text x="100" y="470" font-size="12.5" fill="#374151">于是每轮只在退出时错一次。这个"迟钝"换来了对偶发例外的容忍。</text>
  <text x="100" y="496" font-size="12" font-weight="bold" fill="#3E6B34">复位常设为 01（弱不跳），因为多数分支首次遇到时不跳的概率更高。</text>
</svg>
