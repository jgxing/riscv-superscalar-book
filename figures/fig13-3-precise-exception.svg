<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <title>图13-3 精确异常与状态撤销</title>
  <desc>一条更老的指令 U2 带异常。它之前的 U1 正常提交，U2 到队头触发重定向，U2 及之后的 U3、U4 结果全部撤销，从异常 PC 重新取指。</desc>
  <rect x="0" y="0" width="1000" height="470" fill="#ffffff"/>

  <text x="30" y="38" font-size="18" font-weight="bold" fill="#1f2937">图 13-3　精确异常与状态撤销</text>
  <text x="30" y="62" font-size="12.5" fill="#5F5E5A">异常像一道闸：之前的照常放行，之后的全部推倒重来</text>

  <!-- 队列条目 -->
  <text x="36" y="98" font-size="12.5" font-weight="bold" fill="#374151">程序顺序</text>
  <g font-size="11.5" text-anchor="middle">
    <rect x="40" y="110" width="200" height="96" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.8"/>
    <text x="140" y="138" font-weight="bold" fill="#0C447C">U1　正常</text>
    <text x="140" y="162" fill="#185FA5">done=1</text>
    <text x="140" y="184" fill="#0C447C">异常之前</text>

    <rect x="270" y="110" width="200" height="96" rx="8" fill="#FDECEC" stroke="#B91C1C" stroke-width="2"/>
    <text x="370" y="138" font-weight="bold" fill="#B91C1C">U2　带异常</text>
    <text x="370" y="162" fill="#B91C1C">except=1</text>
    <text x="370" y="184" fill="#B91C1C">异常点</text>

    <rect x="500" y="110" width="200" height="96" rx="8" fill="#F7F9FC" stroke="#94A3B8"/>
    <text x="600" y="138" font-weight="bold" fill="#475569">U3　已完成</text>
    <text x="600" y="162" fill="#64748B">done=1</text>
    <text x="600" y="184" fill="#64748B">异常之后</text>

    <rect x="730" y="110" width="200" height="96" rx="8" fill="#F7F9FC" stroke="#94A3B8"/>
    <text x="830" y="138" font-weight="bold" fill="#475569">U4　执行中</text>
    <text x="830" y="162" fill="#64748B">done=0</text>
    <text x="830" y="184" fill="#64748B">异常之后</text>
  </g>

  <!-- 三阶段 -->
  <g font-size="12">
    <rect x="40" y="240" width="290" height="110" rx="9" fill="#E6F1FB" stroke="#185FA5"/>
    <text x="56" y="266" font-weight="bold" fill="#0C447C">① U1 先提交</text>
    <text x="56" y="290" fill="#374151">异常之前的全部生效</text>
    <text x="56" y="312" fill="#374151">写内存、释放 old_pd 照做</text>
    <text x="56" y="334" fill="#64748B">机器状态停在异常前一刻</text>

    <rect x="355" y="240" width="290" height="110" rx="9" fill="#FDECEC" stroke="#B91C1C" stroke-width="1.6"/>
    <text x="371" y="266" font-weight="bold" fill="#B91C1C">② U2 到队头</text>
    <text x="371" y="290" fill="#7F1D1D">触发重定向，不提交</text>
    <text x="371" y="312" fill="#7F1D1D">给出异常 PC 和处理入口</text>
    <text x="371" y="334" fill="#64748B">精确异常就精确在这里</text>

    <rect x="670" y="240" width="290" height="110" rx="9" fill="#FFF7E8" stroke="#D97706" stroke-width="1.6"/>
    <text x="686" y="266" font-weight="bold" fill="#B45309">③ 后面全部撤销</text>
    <text x="686" y="290" fill="#92400E">U3 / U4 结果作废</text>
    <text x="686" y="312" fill="#92400E">物理寄存器还给空闲表</text>
    <text x="686" y="334" fill="#92400E">RAT 恢复到异常前快照</text>
  </g>

  <!-- 结论条 -->
  <rect x="40" y="378" width="920" height="56" rx="9" fill="#F7F9FC" stroke="#CBD5E1"/>
  <text x="56" y="402" font-size="12" fill="#374151">按序提交把精确异常变简单了：只要在提交口卡住异常项，异常之前自然都已生效。</text>
  <text x="56" y="422" font-size="11.5" fill="#64748B">不需要在乱序执行的每个环节都做撤销，也不用担心哪个结果先写进了架构寄存器。</text>

  <text x="30" y="458" font-size="11.5" fill="#8B5E00">要点　精确异常指软件看到的状态恰好停在出错那条指令之前，一条不多、一条不少</text>
</svg>
